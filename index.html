<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        class GiftTracker {
            constructor() {
                this.people = this.loadData() || [
                    {
                        id: 1,
                        name: 'Sarah',
                        birthday: '06-15',
                        budget: 75,
                        notes: 'Loves coffee and books',
                        gifts: [
                            { id: 1, idea: 'Coffee maker', purchased: false, price: 45 },
                            { id: 2, idea: 'Book series', purchased: true, price: 35 }
                        ]
                    }
                ];
                this.expandedPerson = null;
                this.render();
            }

            loadData() {
                try {
                    return JSON.parse(localStorage.getItem('giftTrackerData'));
                } catch {
                    return null;
                }
            }

            saveData() {
                localStorage.setItem('giftTrackerData', JSON.stringify(this.people));
            }

            addPerson() {
                const newId = Math.max(...this.people.map(p => p.id), 0) + 1;
                this.people.push({
                    id: newId,
                    name: 'New Person',
                    birthday: '01-01',
                    budget: 50,
                    notes: '',
                    gifts: []
                });
                this.expandedPerson = newId;
                this.saveData();
                this.render();
            }

            deletePerson(id) {
                this.people = this.people.filter(p => p.id !== id);
                this.saveData();
                this.render();
            }

            updatePerson(id, updates) {
                const person = this.people.find(p => p.id === id);
                if (person) {
                    Object.assign(person, updates);
                    this.saveData();
                    this.render();
                }
            }

            addGift(personId) {
                const person = this.people.find(p => p.id === personId);
                if (person) {
                    const newId = Math.max(...(person.gifts?.map(g => g.id) || [0]), 0) + 1;
                    person.gifts.push({
                        id: newId,
                        idea: 'New gift',
                        purchased: false,
                        price: 0
                    });
                    this.saveData();
                    this.render();
                }
            }

            updateGift(personId, giftId, updates) {
                const person = this.people.find(p => p.id === personId);
                if (person) {
                    const gift = person.gifts.find(g => g.id === giftId);
                    if (gift) {
                        Object.assign(gift, updates);
                        this.saveData();
                        this.render();
                    }
                }
            }

            deleteGift(personId, giftId) {
                const person = this.people.find(p => p.id === personId);
                if (person) {
                    person.gifts = person.gifts.filter(g => g.id !== giftId);
                    this.saveData();
                    this.render();
                }
            }

            calculateDaysUntil(dateStr) {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const [month, day] = dateStr.split('-');
                const nextDate = new Date(today.getFullYear(), parseInt(month) - 1, parseInt(day));
                if (nextDate < today) {
                    nextDate.setFullYear(today.getFullYear() + 1);
                }
                return Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
            }

            formatDate(dateStr) {
                if (!dateStr) return '';
                const [month, day] = dateStr.split('-');
                const date = new Date(2024, parseInt(month) - 1, parseInt(day));
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }

            renderPersonCard(person) {
                const spent = person.gifts.reduce((sum, g) => sum + (g.price || 0), 0);
                const daysUntil = this.calculateDaysUntil(person.birthday);
                const isExpanded = this.expandedPerson === person.id;

                let html = `
                    <div class="mb-3 bg-white rounded-2xl shadow-sm border border-rose-100 overflow-hidden">
                        <button onclick="app.togglePerson(${person.id})" class="w-full p-4 text-left flex items-center justify-between hover:bg-rose-50/50 transition">
                            <div class="flex-1">
                                <h3 class="font-semibold text-gray-900 text-lg">${person.name}</h3>
                                <p class="text-sm text-rose-600 font-medium">${this.formatDate(person.birthday)} • ${daysUntil} days away</p>
                            </div>
                            <svg class="w-5 h-5 text-rose-400 transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                            </svg>
                        </button>
                `;

                if (isExpanded) {
                    html += `
                        <div class="border-t border-rose-100 p-4 bg-gradient-to-br from-rose-50/50 to-transparent space-y-4">
                            <div class="grid grid-cols-2 gap-3 text-sm">
                                <div class="bg-white rounded-lg p-3 border border-rose-100">
                                    <p class="text-gray-500 text-xs uppercase tracking-wide mb-1">Budget</p>
                                    <input type="number" value="${person.budget}" onchange="app.updatePerson(${person.id}, { budget: parseFloat(this.value) })" class="w-full text-xl font-bold text-rose-600 bg-transparent border-0 p-0 focus:outline-none">
                                </div>
                                <div class="bg-white rounded-lg p-3 border border-rose-100">
                                    <p class="text-gray-500 text-xs uppercase tracking-wide mb-1">Spent</p>
                                    <p class="text-xl font-bold text-gray-900">£${spent.toFixed(2)}</p>
                                </div>
                            </div>
                            <div>
                                <label class="text-xs uppercase text-gray-500 tracking-wide block mb-2">Notes</label>
                                <textarea onchange="app.updatePerson(${person.id}, { notes: this.value })" placeholder="Add reminders..." class="w-full p-3 rounded-lg border border-rose-100 text-sm text-gray-900 resize-none" rows="2">${person.notes || ''}</textarea>
                            </div>
                            <div>
                                <p class="text-xs uppercase text-gray-500 tracking-wide mb-3 font-medium">Gift Ideas</p>
                                <div class="space-y-2">
                                    ${person.gifts.map(gift => `
                                        <div class="flex items-start gap-3 bg-white rounded-lg p-3 border border-rose-100">
                                            <button onclick="app.updateGift(${person.id}, ${gift.id}, { purchased: ${!gift.purchased} })" class="mt-1 w-5 h-5 rounded flex items-center justify-center flex-shrink-0 transition ${gift.purchased ? 'bg-green-500 text-white' : 'border-2 border-gray-300'}">
                                                ${gift.purchased ? '✓' : ''}
                                            </button>
                                            <div class="flex-1">
                                                <input type="text" value="${gift.idea}" onchange="app.updateGift(${person.id}, ${gift.id}, { idea: this.value })" class="w-full text-sm font-medium text-gray-900 bg-transparent border-0 p-0">
                                                <input type="number" value="${gift.price}" onchange="app.updateGift(${person.id}, ${gift.id}, { price: parseFloat(this.value) })" placeholder="£0" class="text-xs text-gray-500 bg-transparent border-0 p-0 w-12">
                                            </div>
                                            <button onclick="app.deleteGift(${person.id}, ${gift.id})" class="text-gray-400 hover:text-red-500">✕</button>
                                        </div>
                                    `).join('')}
                                </div>
                                <button onclick="app.addGift(${person.id})" class="mt-3 w-full py-2 text-sm font-medium text-rose-600 hover:bg-rose-50 rounded-lg border border-rose-200">+ Add Gift Idea</button>
                            </div>
                            <button onclick="app.deletePerson(${person.id})" class="w-full py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg border border-red-200 font-medium">Remove Person</button>
                        </div>
                    `;
                }

                html += '</div>';
                return html;
            }

            togglePerson(id) {
                this.expandedPerson = this.expandedPerson === id ? null : id;
                this.render();
            }

            render() {
                const html = `
                    <div class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-amber-50">
                        <div class="sticky top-0 z-10 bg-white/80 backdrop-blur-lg border-b border-rose-100">
                            <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <svg class="w-6 h-6 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v-1m0 0a3 3 0 100 6 3 3 0 000-6zm0 0V5m0 0a3 3 0 00-3 3v1m3-1a3 3 0 013 3v1"></path>
                                    </svg>
                                    <h1 class="text-2xl font-bold text-gray-900">Gift Tracker</h1>
                                </div>
                                <button onclick="app.addPerson()" class="bg-rose-500 hover:bg-rose-600 text-white rounded-full p-2 transition shadow-md">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="max-w-2xl mx-auto px-4 py-6 pb-20">
                            ${this.people.length === 0 ? `
                                <div class="text-center py-12">
                                    <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v-1m0 0a3 3 0 100 6 3 3 0 000-6zm0 0V5m0 0a3 3 0 00-3 3v1m3-1a3 3 0 013 3v1"></path>
                                    </svg>
                                    <p class="text-gray-500">No people yet. Add someone to get started!</p>
                                </div>
                            ` : this.people.map(p => this.renderPersonCard(p)).join('')}
                        </div>
                    </div>
                `;

                document.getElementById('app').innerHTML = html;
            }
        }

        const app = new GiftTracker();
    </script>
</body>
</html>
