<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        
        :root {
          --color-bg: #F7F3EA;
          --color-surface: #FFFCF6;
          --color-primary: #8FAF9A;
          --color-primary-text: #23352B;
          --color-secondary: #DDE8DF;
          --color-accent: #C97B63;
          --color-text: #2F2A25;
          --color-text-muted: #7A7168;
          --color-border: #E5DCCF;
          --color-success: #6F9B7A;
          --color-warning: #D8A85A;
          --color-error: #B85C50;
        }
        
        * { font-family: 'Poppins', sans-serif; }
        
        body {
          background-color: var(--color-bg);
        }
        
        .swipe-item {
            position: relative;
            overflow: hidden;
        }
        
        .swipe-item-content {
            display: flex;
            transition: transform 0.3s ease-out;
            touch-action: pan-y;
        }
        
        .swipe-item.swiped .swipe-item-content {
            transform: translateX(-60px);
        }
        
        .swipe-delete {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 60px;
            background-color: var(--color-error);
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
        }
        
        .swipe-item.swiped .swipe-delete {
            display: flex;
        }
    </style>
</head>
<body>
    <div id="app">Loading...</div>

    <script>
        class GiftTracker {
            constructor() {
                const data = this.loadData();
                this.people = data?.people || [];
                this.events = data?.events || [];
                this.gifts = data?.gifts || [];
                this.currentTab = 'events';
                this.expandedPerson = null;
                this.expandedGift = null;
                this.expandedEvent = null;
                this.editingPerson = null;
                this.editingEvent = null;
                this.editingGift = null;
                this.addingPerson = false;
                this.addingEvent = false;
                this.addingGift = false;
                this.eventType = null;
                this.newGiftEventId = null;
                this.newGiftPersonName = null;
                this.showPurchased = 'all';
                this.showEventType = 'upcoming';
                this.showEventReady = 'all';
                this.showSettings = false;
                this.render();
            }

            loadData() {
                try {
                    const saved = localStorage.getItem('giftTrackerData');
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    console.error('Load error:', e);
                    return null;
                }
            }

            saveData() {
                try {
                    localStorage.setItem('giftTrackerData', JSON.stringify({ 
                        people: this.people, 
                        events: this.events,
                        gifts: this.gifts
                    }));
                } catch (e) {
                    console.error('Save error:', e);
                }
            }

            initSwipeHandlers() {
                setTimeout(() => {
                    document.querySelectorAll('[data-swipe-item]').forEach(el => {
                        let touchStartX = 0;
                        let touchEndX = 0;
                        
                        el.addEventListener('touchstart', (e) => {
                            touchStartX = e.changedTouches[0].screenX;
                        });
                        
                        el.addEventListener('touchend', (e) => {
                            touchEndX = e.changedTouches[0].screenX;
                            if (touchStartX - touchEndX > 50) {
                                el.classList.add('swiped');
                            } else if (touchEndX - touchStartX > 50) {
                                el.classList.remove('swiped');
                            }
                        });
                    });
                }, 100);
            }

            // PEOPLE METHODS
            toggleAddPerson() {
                this.addingPerson = !this.addingPerson;
                this.render();
            }

            addPerson(fullName, birthday, likes, dislikes, notes) {
                if (!fullName || !birthday) {
                    alert('Please fill in name and birthday (DD/MM/YYYY)');
                    return;
                }
                const parts = birthday.split('/');
                if (parts.length !== 3 || parts[0].length !== 2 || parts[1].length !== 2 || parts[2].length !== 4) {
                    alert('Birthday must be in format DD/MM/YYYY');
                    return;
                }
                const newId = Math.max(...this.people.map(p => p.id), 0) + 1;
                this.people.push({
                    id: newId,
                    fullName: fullName,
                    birthday: parts[0] + '-' + parts[1],
                    birthYear: parseInt(parts[2]),
                    likes: likes || '',
                    dislikes: dislikes || '',
                    notes: notes || '',
                    includeInChristmas: false
                });
                this.addingPerson = false;
                this.expandedPerson = newId;
                this.saveData();
                this.render();
            }

            deletePerson(id) {
                this.people = this.people.filter(p => p.id !== id);
                this.saveData();
                this.render();
            }

            updatePerson(id, updates) {
                const person = this.people.find(p => p.id === id);
                if (person) {
                    Object.assign(person, updates);
                    this.saveData();
                    this.render();
                }
            }

            expandPerson(id) {
                this.expandedPerson = this.expandedPerson === id ? null : id;
                this.editingPerson = null;
                this.render();
            }

            toggleEditPerson(id) {
                this.editingPerson = this.editingPerson === id ? null : id;
                this.render();
            }

            getUpcomingAge(person) {
                const today = new Date();
                const [day, month] = person.birthday.split('-');
                let nextBirthday = new Date(today.getFullYear(), parseInt(month) - 1, parseInt(day));
                if (nextBirthday < today) {
                    nextBirthday = new Date(today.getFullYear() + 1, parseInt(month) - 1, parseInt(day));
                }
                return nextBirthday.getFullYear() - person.birthYear;
            }

            getNextEvent(person) {
                const today = new Date();
                const [day, month] = person.birthday.split('-');
                
                let birthdayThisYear = new Date(today.getFullYear(), parseInt(month) - 1, parseInt(day));
                if (birthdayThisYear < today) {
                    birthdayThisYear = new Date(today.getFullYear() + 1, parseInt(month) - 1, parseInt(day));
                }
                
                const christmasThisYear = new Date(today.getFullYear(), 11, 25);
                if (today > christmasThisYear) {
                    var christmasNext = new Date(today.getFullYear() + 1, 11, 25);
                } else {
                    var christmasNext = christmasThisYear;
                }
                
                if (birthdayThisYear <= christmasNext) {
                    return birthdayThisYear.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' (Birthday)';
                } else {
                    return '25 Dec (Christmas)';
                }
            }

            formatBirthdayWithYear(person) {
                const [day, month] = person.birthday.split('-');
                return day + '/' + month + '/' + person.birthYear;
            }

            formatDateShort(dateStr) {
                if (!dateStr) return '';
                const [day, month] = dateStr.split('-');
                const date = new Date(2024, parseInt(month) - 1, parseInt(day));
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }

            getMonthYear(dateStr) {
                if (!dateStr) return '';
                const [day, month, year] = dateStr.split('-');
                const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
                return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            }

            // EVENT METHODS
            toggleAddEvent() {
                this.addingEvent = !this.addingEvent;
                this.eventType = null;
                this.render();
            }

            selectEventType(type) {
                this.eventType = type;
                this.render();
            }

            getYearDropdown() {
                const currentYear = new Date().getFullYear();
                let years = '';
                for (let i = currentYear - 7; i <= currentYear + 5; i++) {
                    years += '<option value="' + i + '">' + i + '</option>';
                }
                return years;
            }

            addBirthdayEvent(personId, year) {
                if (!personId || !year) {
                    alert('Please select a person and year');
                    return;
                }
                const person = this.people.find(p => p.id === parseInt(personId));
                if (!person) return;

                const age = parseInt(year) - person.birthYear;
                const eventId = Math.max(...this.events.map(e => e.id), 0) + 1;
                const [day, month] = person.birthday.split('-');
                
                this.events.push({
                    id: eventId,
                    type: 'birthday',
                    name: person.fullName + "'s " + age + this.getOrdinalSuffix(age) + ' birthday',
                    date: day + '-' + month + '-' + year,
                    budget: 0,
                    notes: '',
                    personId: person.id,
                    personName: person.fullName,
                    year: parseInt(year),
                    people: [{ name: person.fullName, budget: 0 }],
                    giftIds: []
                });
                this.addingEvent = false;
                this.eventType = null;
                this.saveData();
                this.render();
            }

            addChristmasEvent(year, totalBudget) {
                if (!year) {
                    alert('Please select a year');
                    return;
                }
                const christmasPeople = this.people.filter(p => p.includeInChristmas).map(p => ({
                    name: p.fullName,
                    budget: 0
                }));

                const eventId = Math.max(...this.events.map(e => e.id), 0) + 1;
                
                this.events.push({
                    id: eventId,
                    type: 'christmas',
                    name: 'Christmas ' + year,
                    date: '25-12-' + year,
                    budget: parseFloat(totalBudget) || 0,
                    notes: '',
                    year: parseInt(year),
                    people: christmasPeople,
                    giftIds: []
                });
                this.addingEvent = false;
                this.eventType = null;
                this.saveData();
                this.render();
            }

            updateEvent(id, updates) {
                const event = this.events.find(e => e.id === id);
                if (event) {
                    Object.assign(event, updates);
                    this.saveData();
                    this.render();
                }
            }

            deleteEvent(id) {
                this.events = this.events.filter(e => e.id !== id);
                this.gifts = this.gifts.filter(g => g.eventId !== id);
                this.saveData();
                this.render();
            }

            expandEvent(id) {
                this.expandedEvent = this.expandedEvent === id ? null : id;
                this.editingEvent = null;
                this.render();
            }

            toggleEditEvent(id) {
                this.editingEvent = this.editingEvent === id ? null : id;
                this.render();
            }

            addGiftToEvent(eventId, giftId) {
                const event = this.events.find(e => e.id === eventId);
                const gift = this.gifts.find(g => g.id === giftId);
                if (event && gift) {
                    if (!event.giftIds) event.giftIds = [];
                    if (!event.giftIds.includes(giftId)) {
                        event.giftIds.push(giftId);
                        gift.eventId = eventId;
                        this.saveData();
                        this.render();
                    }
                }
            }

            removeGiftFromEvent(eventId, giftId) {
                const event = this.events.find(e => e.id === eventId);
                if (event) {
                    event.giftIds = event.giftIds.filter(id => id !== giftId);
                    this.saveData();
                    this.render();
                }
            }

            addPersonToChristmas(eventId, personName) {
                const event = this.events.find(e => e.id === eventId);
                if (event && event.type === 'christmas') {
                    if (!event.people.find(p => p.name === personName)) {
                        event.people.push({ name: personName, budget: 0 });
                        this.saveData();
                        this.render();
                    }
                }
            }

            removePersonFromChristmas(eventId, personName) {
                const event = this.events.find(e => e.id === eventId);
                if (event && event.type === 'christmas') {
                    event.people = event.people.filter(p => p.name !== personName);
                    this.saveData();
                    this.render();
                }
            }

            getBudgetStatus(event) {
                const eventGifts = this.getGiftsForEvent(event.id);
                const spent = eventGifts.reduce((sum, g) => sum + g.price, 0);
                
                if (event.budget === 0) return '';
                if (spent === 0) return '<span class="text-xs px-2 py-1 rounded-full" style="background-color: var(--color-secondary); color: var(--color-primary-text);">No spending</span>';
                if (spent > event.budget) return '<span class="text-xs px-2 py-1 rounded-full" style="background-color: #FFE5E0; color: var(--color-error);">Over budget</span>';
                if (spent === event.budget) return '<span class="text-xs px-2 py-1 rounded-full" style="background-color: #F0E5D0; color: var(--color-warning);">At budget</span>';
                return '<span class="text-xs px-2 py-1 rounded-full" style="background-color: #D5E8E0; color: var(--color-success);">Within budget</span>';
            }

            isEventReady(event) {
                const eventGifts = this.getGiftsForEvent(event.id);
                return eventGifts.some(g => g.status === 'purchased');
            }

            // GIFT METHODS
            toggleAddGift() {
                this.addingGift = !this.addingGift;
                this.newGiftEventId = null;
                this.newGiftPersonName = null;
                this.render();
            }

            startNewGiftForEvent(eventId, personName = null) {
                this.addingGift = true;
                this.newGiftEventId = eventId;
                this.newGiftPersonName = personName;
                this.render();
            }

            addGift(giftName, personName, eventId, price, status) {
                if (!giftName) {
                    alert('Please enter a gift name');
                    return;
                }
                const newId = Math.max(...this.gifts.map(g => g.id), 0) + 1;
                
                this.gifts.push({
                    id: newId,
                    giftName: giftName,
                    personName: personName || '',
                    eventId: eventId ? parseInt(eventId) : null,
                    status: status || 'not purchased',
                    price: parseFloat(price) || 0,
                    url: '',
                    notes: ''
                });
                this.addingGift = false;
                this.newGiftEventId = null;
                this.newGiftPersonName = null;
                this.saveData();
                this.render();
            }

            updateGift(id, updates) {
                const gift = this.gifts.find(g => g.id === id);
                if (gift) {
                    Object.assign(gift, updates);
                    this.saveData();
                    this.render();
                }
            }

            deleteGift(id) {
                this.gifts = this.gifts.filter(g => g.id !== id);
                this.events.forEach(e => {
                    if (e.giftIds) e.giftIds = e.giftIds.filter(gId => gId !== id);
                });
                this.saveData();
                this.render();
            }

            expandGift(id) {
                this.expandedGift = this.expandedGift === id ? null : id;
                this.editingGift = null;
                this.render();
            }

            toggleEditGift(id) {
                this.editingGift = this.editingGift === id ? null : id;
                this.render();
            }

            getGiftsForEvent(eventId) {
                return this.gifts.filter(g => g.eventId === eventId);
            }

            getGiftsForPerson(personName) {
                return this.gifts.filter(g => g.personName === personName);
            }

            getGiftsForEventAndPerson(eventId, personName) {
                return this.gifts.filter(g => g.eventId === eventId && g.personName === personName);
            }

            isEventUpcoming(event) {
                const [day, month, year] = event.date.split('-');
                const eventDate = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
                return eventDate >= new Date();
            }

            getOrdinalSuffix(num) {
                if (num > 3 && num < 21) return 'th';
                switch (num % 10) {
                    case 1: return 'st';
                    case 2: return 'nd';
                    case 3: return 'rd';
                    default: return 'th';
                }
            }

            getSortedPeople() {
                return [...this.people].sort((a, b) => a.fullName.localeCompare(b.fullName));
            }

            getSortedEvents() {
                return [...this.events].sort((a, b) => {
                    const [dayA, monthA, yearA] = a.date.split('-');
                    const [dayB, monthB, yearB] = b.date.split('-');
                    const dateA = new Date(parseInt(yearA), parseInt(monthA) - 1, parseInt(dayA));
                    const dateB = new Date(parseInt(yearB), parseInt(monthB) - 1, parseInt(dayB));
                    return dateA - dateB;
                });
            }

            // REPORTING METHODS
            getTotalSpent() {
                return this.gifts.reduce((sum, g) => sum + g.price, 0);
            }

            getAverageBirthdaySpend() {
                const birthdayEvents = this.events.filter(e => e.type === 'birthday');
                if (birthdayEvents.length === 0) return 0;
                const birthdaySpend = birthdayEvents.reduce((sum, e) => {
                    const eventGifts = this.getGiftsForEvent(e.id);
                    return sum + eventGifts.reduce((s, g) => s + g.price, 0);
                }, 0);
                return (birthdaySpend / birthdayEvents.length).toFixed(2);
            }

            getAverageChristmasSpend() {
                const christmasEvents = this.events.filter(e => e.type === 'christmas');
                if (christmasEvents.length === 0) return 0;
                const christmasSpend = christmasEvents.reduce((sum, e) => {
                    const eventGifts = this.getGiftsForEvent(e.id);
                    return sum + eventGifts.reduce((s, g) => s + g.price, 0);
                }, 0);
                return (christmasSpend / christmasEvents.length).toFixed(2);
            }

            getTopGiftees() {
                const giftsPerPerson = {};
                this.gifts.forEach(gift => {
                    if (gift.personName) {
                        if (!giftsPerPerson[gift.personName]) {
                            giftsPerPerson[gift.personName] = { count: 0, spent: 0 };
                        }
                        giftsPerPerson[gift.personName].count++;
                        giftsPerPerson[gift.personName].spent += gift.price;
                    }
                });
                return Object.entries(giftsPerPerson)
                    .map(([name, data]) => ({ name, ...data }))
                    .sort((a, b) => b.spent - a.spent)
                    .slice(0, 5);
            }

            getPurchasedVsUnpurchased() {
                const purchased = this.gifts.filter(g => g.status === 'purchased').length;
                const unpurchased = this.gifts.filter(g => g.status === 'not purchased').length;
                return { purchased, unpurchased, total: purchased + unpurchased };
            }

            renderReportingTab() {
                const totalSpent = this.getTotalSpent();
                const avgBirthday = this.getAverageBirthdaySpend();
                const avgChristmas = this.getAverageChristmasSpend();
                const topGiftees = this.getTopGiftees();
                const { purchased, unpurchased, total } = this.getPurchasedVsUnpurchased();
                const birthdays = this.events.filter(e => e.type === 'birthday').length;
                const christmas = this.events.filter(e => e.type === 'christmas').length;

                let html = '<div class="space-y-4">';

                html += '<div class="grid grid-cols-2 gap-3"><div class="rounded-2xl p-4 border" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);"><p class="text-xs uppercase tracking-wide font-bold mb-1" style="color: var(--color-accent);">Total Spent</p><p class="text-2xl font-bold">£' + totalSpent.toFixed(2) + '</p></div><div class="rounded-2xl p-4 border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs uppercase tracking-wide font-bold mb-1" style="color: var(--color-text-muted);">Total Gifts</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + total + '</p></div></div>';

                html += '<div class="grid grid-cols-2 gap-3"><div class="rounded-2xl p-4 border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs uppercase tracking-wide font-bold mb-1" style="color: var(--color-text-muted);">Birthdays</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + birthdays + '</p></div><div class="rounded-2xl p-4 border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs uppercase tracking-wide font-bold mb-1" style="color: var(--color-text-muted);">Christmas</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + christmas + '</p></div></div>';

                html += '<div class="grid grid-cols-2 gap-3"><div class="rounded-2xl p-4 border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs uppercase tracking-wide font-bold mb-1" style="color: var(--color-primary);">Avg Birthday</p><p class="text-xl font-bold" style="color: var(--color-text);">£' + avgBirthday + '</p></div><div class="rounded-2xl p-4 border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs uppercase tracking-wide font-bold mb-1" style="color: var(--color-success);">Avg Christmas</p><p class="text-xl font-bold" style="color: var(--color-text);">£' + avgChristmas + '</p></div></div>';

                html += '<div class="rounded-2xl p-4 border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs uppercase tracking-wide font-bold mb-3" style="color: var(--color-text-muted);">Purchase Status</p><div class="space-y-2"><div class="flex items-center justify-between"><span class="text-sm" style="color: var(--color-text);">Purchased</span><span class="text-sm font-bold" style="color: var(--color-success);">✓ ' + purchased + '</span></div><div class="flex items-center justify-between"><span class="text-sm" style="color: var(--color-text);">Not Purchased</span><span class="text-sm font-bold" style="color: var(--color-warning);">○ ' + unpurchased + '</span></div><div class="w-full rounded-full h-2 mt-2" style="background-color: var(--color-border);"><div class="h-2 rounded-full" style="width: ' + (total > 0 ? (purchased / total * 100) : 0) + '%; background-color: var(--color-success);"></div></div></div></div>';

                if (topGiftees.length > 0) {
                    html += '<div class="rounded-2xl p-4 border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs uppercase tracking-wide font-bold mb-3" style="color: var(--color-text-muted);">Top Recipients</p><div class="space-y-2">';
                    topGiftees.forEach((giftee, idx) => {
                        html += '<div class="flex items-center justify-between pb-2' + (idx < topGiftees.length - 1 ? ' border-b" style="border-color: var(--color-border);"' : '"') + '><div><p class="text-sm font-medium" style="color: var(--color-text);">' + (idx + 1) + '. ' + giftee.name + '</p><p class="text-xs" style="color: var(--color-text-muted);">' + giftee.count + ' gift' + (giftee.count > 1 ? 's' : '') + '</p></div><p class="text-sm font-bold" style="color: var(--color-accent);">£' + giftee.spent.toFixed(2) + '</p></div>';
                    });
                    html += '</div></div>';
                }

                html += '</div>';
                return html;
            }

            renderPeopleTab() {
                let html = '';
                
                if (this.addingPerson) {

            // EXPORT METHOD
            exportToExcel() {
                const data = {
                    people: this.people,
                    events: this.events,
                    gifts: this.gifts,
                    exportDate: new Date().toISOString()
                };

                // Convert to CSV format
                let csv = 'GIFT TRACKER EXPORT\n';
                csv += 'Export Date: ' + new Date().toLocaleString() + '\n\n';

                // PEOPLE
                csv += '=== PEOPLE ===\n';
                csv += 'ID,Full Name,Birthday (DD-MM),Birth Year,Likes,Dislikes,Notes,Include in Christmas\n';
                this.people.forEach(p => {
                    csv += p.id + ',"' + p.fullName + '",' + p.birthday + ',' + p.birthYear + ',"' + (p.likes || '') + '","' + (p.dislikes || '') + '","' + (p.notes || '') + '",' + (p.includeInChristmas ? 'Yes' : 'No') + '\n';
                });

                csv += '\n=== EVENTS ===\n';
                csv += 'ID,Type,Name,Date (DD-MM-YYYY),Budget,Notes,Person ID,Person Name,Year,Gift IDs\n';
                this.events.forEach(e => {
                    csv += e.id + ',' + e.type + ',"' + e.name + '",' + e.date + ',' + e.budget + ',"' + (e.notes || '') + '",' + (e.personId || '') + ',' + (e.personName || '') + ',' + e.year + ',"' + (e.giftIds ? e.giftIds.join(';') : '') + '"\n';
                });

                csv += '\n=== GIFTS ===\n';
                csv += 'ID,Gift Name,Person Name,Event ID,Status,Price,URL,Notes\n';
                this.gifts.forEach(g => {
                    csv += g.id + ',"' + g.giftName + '","' + (g.personName || '') + '",' + (g.eventId || '') + ',' + g.status + ',' + g.price + ',"' + (g.url || '') + '","' + (g.notes || '') + '"\n';
                });

                csv += '\n=== RELATIONSHIPS ===\n';
                csv += 'Event ID,People List\n';
                this.events.forEach(e => {
                    if (e.people && e.people.length > 0) {
                        csv += e.id + ',"' + e.people.map(p => p.name).join('; ') + '"\n';
                    }
                });

                // Create blob and download
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', 'gift-tracker-export-' + new Date().toISOString().split('T')[0] + '.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

-color: var(--color-secondary); color: var(--color-text);">Close</button></div>' : '') + '<div class="max-w-2xl mx-auto px-4 flex gap-2 border-t overflow-x-auto" style="border-color: var(--color-border);"><button onclick="window.app.currentTab = \'events\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab === 'events' ? 'var(--color-primary)' : 'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab === 'events' ? 'var(--color-primary)' : 'transparent') + ';">Events</button><button onclick="window.app.currentTab = \'people\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab === 'people' ? 'var(--color-primary)' : 'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab === 'people' ? 'var(--color-primary)' : 'transparent') + ';">People</button><button onclick="window.app.currentTab = \'gifts\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab === 'gifts' ? 'var(--color-primary)' : 'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab === 'gifts' ? 'var(--color-primary)' : 'transparent') + ';">Gifts</button><button onclick="window.app.currentTab = \'reporting\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab === 'reporting' ? 'var(--color-primary)' : 'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab === 'reporting' ? 'var(--color-primary)' : 'transparent') + ';">Reporting</button></div></div><div class="max-w-2xl mx-auto px-4 py-6 pb-20">' + tabContent + '</div></div>';

                document.getElementById('app').innerHTML = html;
                this.initSwipeHandlers();
            }
        }

        window.app = new GiftTracker();
    </script>
