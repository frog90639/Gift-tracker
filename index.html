<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>
    <div id="app">Loading...</div>

    <script>
        class GiftTracker {
            constructor() {
                const data = this.loadData();
                this.people = data?.people || [
                    {
                        id: 1,
                        fullName: 'Sarah',
                        birthday: '15-06',
                        likes: 'Coffee, books',
                        dislikes: 'Flowers',
                        notes: 'Loves cozy things',
                        includeInChristmas: true
                    }
                ];
                this.events = data?.events || [];
                this.gifts = data?.gifts || [];
                this.currentTab = 'events';
                this.expandedPerson = null;
                this.expandedGift = null;
                this.expandedEvent = null;
                this.editingPerson = null;
                this.editingEvent = null;
                this.editingGift = null;
                this.addingPerson = false;
                this.addingEvent = false;
                this.addingGift = false;
                this.eventType = null;
                this.newGiftEventId = null;
                this.newGiftPersonName = null;
                this.showPurchased = 'all';
                this.showEventType = 'upcoming';
                this.showEventReady = 'all';
                this.render();
            }

            loadData() {
                try {
                    const saved = localStorage.getItem('giftTrackerData');
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    console.error('Load error:', e);
                    return null;
                }
            }

            saveData() {
                try {
                    localStorage.setItem('giftTrackerData', JSON.stringify({ 
                        people: this.people, 
                        events: this.events,
                        gifts: this.gifts
                    }));
                } catch (e) {
                    console.error('Save error:', e);
                }
            }

            // PEOPLE METHODS
            toggleAddPerson() {
                this.addingPerson = !this.addingPerson;
                this.render();
            }

            addPerson(fullName, birthday, likes, dislikes, notes) {
                if (!fullName || !birthday) {
                    alert('Please fill in name and birthday');
                    return;
                }
                const newId = Math.max(...this.people.map(p => p.id), 0) + 1;
                this.people.push({
                    id: newId,
                    fullName: fullName,
                    birthday: birthday,
                    likes: likes || '',
                    dislikes: dislikes || '',
                    notes: notes || '',
                    includeInChristmas: false
                });
                this.addingPerson = false;
                this.expandedPerson = newId;
                this.saveData();
                this.render();
            }

            deletePerson(id) {
                this.people = this.people.filter(p => p.id !== id);
                this.saveData();
                this.render();
            }

            updatePerson(id, updates) {
                const person = this.people.find(p => p.id === id);
                if (person) {
                    Object.assign(person, updates);
                    this.saveData();
                    this.render();
                }
            }

            expandPerson(id) {
                this.expandedPerson = this.expandedPerson === id ? null : id;
                this.editingPerson = null;
                this.render();
            }

            toggleEditPerson(id) {
                this.editingPerson = this.editingPerson === id ? null : id;
                this.render();
            }

            getNextBirthday(person) {
                const today = new Date();
                const [day, month] = person.birthday.split('-');
                let nextBirthday = new Date(today.getFullYear(), parseInt(month) - 1, parseInt(day));
                if (nextBirthday < today) {
                    nextBirthday = new Date(today.getFullYear() + 1, parseInt(month) - 1, parseInt(day));
                }
                return nextBirthday;
            }

            getUpcomingAge(person) {
                const nextBirthday = this.getNextBirthday(person);
                const birthYear = nextBirthday.getFullYear() - 30;
                return nextBirthday.getFullYear() - birthYear;
            }

            formatDate(dateStr) {
                if (!dateStr) return '';
                const [day, month] = dateStr.split('-');
                const date = new Date(2024, parseInt(month) - 1, parseInt(day));
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }

            getMonthYear(dateStr) {
                if (!dateStr) return '';
                const [day, month, year] = dateStr.split('-');
                const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
                return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            }

            // EVENT METHODS
            toggleAddEvent() {
                this.addingEvent = !this.addingEvent;
                this.eventType = null;
                this.render();
            }

            selectEventType(type) {
                this.eventType = type;
                this.render();
            }

            getYearDropdown() {
                const currentYear = new Date().getFullYear();
                let years = '';
                for (let i = currentYear - 7; i <= currentYear + 5; i++) {
                    years += '<option value="' + i + '">' + i + '</option>';
                }
                return years;
            }

            addBirthdayEvent(personId, year) {
                if (!personId || !year) {
                    alert('Please select a person and year');
                    return;
                }
                const person = this.people.find(p => p.id === parseInt(personId));
                if (!person) return;

                const age = parseInt(year) - (parseInt(year) - this.getUpcomingAge(person));
                const eventId = Math.max(...this.events.map(e => e.id), 0) + 1;
                const [day, month] = person.birthday.split('-');
                
                this.events.push({
                    id: eventId,
                    type: 'birthday',
                    name: person.fullName + "'s " + age + this.getOrdinalSuffix(age) + ' birthday',
                    date: day + '-' + month + '-' + year,
                    budget: 0,
                    notes: '',
                    personId: person.id,
                    personName: person.fullName,
                    year: parseInt(year),
                    people: [{ name: person.fullName, budget: 0 }],
                    giftIds: []
                });
                this.addingEvent = false;
                this.eventType = null;
                this.saveData();
                this.render();
            }

            addChristmasEvent(year, totalBudget) {
                if (!year) {
                    alert('Please select a year');
                    return;
                }
                const christmasPeople = this.people.filter(p => p.includeInChristmas).map(p => ({
                    name: p.fullName,
                    budget: 0
                }));

                const eventId = Math.max(...this.events.map(e => e.id), 0) + 1;
                
                this.events.push({
                    id: eventId,
                    type: 'christmas',
                    name: 'Christmas ' + year,
                    date: '25-12-' + year,
                    budget: parseFloat(totalBudget) || 0,
                    notes: '',
                    year: parseInt(year),
                    people: christmasPeople,
                    giftIds: []
                });
                this.addingEvent = false;
                this.eventType = null;
                this.saveData();
                this.render();
            }

            updateEvent(id, updates) {
                const event = this.events.find(e => e.id === id);
                if (event) {
                    Object.assign(event, updates);
                    this.saveData();
                    this.render();
                }
            }

            deleteEvent(id) {
                this.events = this.events.filter(e => e.id !== id);
                this.gifts = this.gifts.filter(g => g.eventId !== id);
                this.saveData();
                this.render();
            }

            expandEvent(id) {
                this.expandedEvent = this.expandedEvent === id ? null : id;
                this.editingEvent = null;
                this.render();
            }

            toggleEditEvent(id) {
                this.editingEvent = this.editingEvent === id ? null : id;
                this.render();
            }

            addGiftToEvent(eventId, giftId) {
                const event = this.events.find(e => e.id === eventId);
                const gift = this.gifts.find(g => g.id === giftId);
                if (event && gift) {
                    if (!event.giftIds) event.giftIds = [];
                    if (!event.giftIds.includes(giftId)) {
                        event.giftIds.push(giftId);
                        gift.eventId = eventId;
                        this.saveData();
                        this.render();
                    }
                }
            }

            removeGiftFromEvent(eventId, giftId) {
                const event = this.events.find(e => e.id === eventId);
                if (event) {
                    event.giftIds = event.giftIds.filter(id => id !== giftId);
                    this.saveData();
                    this.render();
                }
            }

            addPersonToChristmas(eventId, personName) {
                const event = this.events.find(e => e.id === eventId);
                if (event && event.type === 'christmas') {
                    if (!event.people.find(p => p.name === personName)) {
                        event.people.push({ name: personName, budget: 0 });
                        this.saveData();
                        this.render();
                    }
                }
            }

            removePersonFromChristmas(eventId, personName) {
                const event = this.events.find(e => e.id === eventId);
                if (event && event.type === 'christmas') {
                    event.people = event.people.filter(p => p.name !== personName);
                    this.saveData();
                    this.render();
                }
            }

            getBudgetStatus(event) {
                const eventGifts = this.getGiftsForEvent(event.id);
                const spent = eventGifts.reduce((sum, g) => sum + g.price, 0);
                
                if (event.budget === 0) return '';
                if (spent === 0) return '<span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">No spending</span>';
                if (spent > event.budget) return '<span class="text-xs bg-red-100 text-red-800 px-2 py-1 rounded-full">Over budget</span>';
                if (spent === event.budget) return '<span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full">At budget</span>';
                return '<span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full">Within budget</span>';
            }

            isEventReady(event) {
                const eventGifts = this.getGiftsForEvent(event.id);
                return eventGifts.some(g => g.status === 'purchased');
            }

            // GIFT METHODS
            toggleAddGift() {
                this.addingGift = !this.addingGift;
                this.newGiftEventId = null;
                this.newGiftPersonName = null;
                this.render();
            }

            startNewGiftForEvent(eventId, personName = null) {
                this.addingGift = true;
                this.newGiftEventId = eventId;
                this.newGiftPersonName = personName;
                this.render();
            }

            addGift(giftName, personName, eventId, price, status) {
                if (!giftName) {
                    alert('Please enter a gift name');
                    return;
                }
                const newId = Math.max(...this.gifts.map(g => g.id), 0) + 1;
                const event = this.events.find(e => e.id === parseInt(eventId));
                
                this.gifts.push({
                    id: newId,
                    giftName: giftName,
                    personName: personName || '',
                    eventId: eventId ? parseInt(eventId) : null,
                    status: status || 'not purchased',
                    price: parseFloat(price) || 0,
                    url: '',
                    notes: '',
                    eventDate: event?.date || '',
                    budget: 0,
                    eventBudget: event?.budget || 0
                });
                this.addingGift = false;
                this.newGiftEventId = null;
                this.newGiftPersonName = null;
                this.saveData();
                this.render();
            }

            updateGift(id, updates) {
                const gift = this.gifts.find(g => g.id === id);
                if (gift) {
                    Object.assign(gift, updates);
                    this.saveData();
                    this.render();
                }
            }

            deleteGift(id) {
                this.gifts = this.gifts.filter(g => g.id !== id);
                this.events.forEach(e => {
                    if (e.giftIds) e.giftIds = e.giftIds.filter(gId => gId !== id);
                });
                this.saveData();
                this.render();
            }

            expandGift(id) {
                this.expandedGift = this.expandedGift === id ? null : id;
                this.editingGift = null;
                this.render();
            }

            toggleEditGift(id) {
                this.editingGift = this.editingGift === id ? null : id;
                this.render();
            }

            getGiftsForEvent(eventId) {
                return this.gifts.filter(g => g.eventId === eventId);
            }

            getGiftsForPerson(personName) {
                return this.gifts.filter(g => g.personName === personName);
            }

            isEventUpcoming(event) {
                const [day, month, year] = event.date.split('-');
                const eventDate = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
                return eventDate >= new Date();
            }

            getOrdinalSuffix(num) {
                if (num > 3 && num < 21) return 'th';
                switch (num % 10) {
                    case 1: return 'st';
                    case 2: return 'nd';
                    case 3: return 'rd';
                    default: return 'th';
                }
            }

            getSortedPeople() {
                return [...this.people].sort((a, b) => a.fullName.localeCompare(b.fullName));
            }

            getSortedEvents() {
                return [...this.events].sort((a, b) => {
                    const [dayA, monthA, yearA] = a.date.split('-');
                    const [dayB, monthB, yearB] = b.date.split('-');
                    const dateA = new Date(parseInt(yearA), parseInt(monthA) - 1, parseInt(dayA));
                    const dateB = new Date(parseInt(yearB), parseInt(monthB) - 1, parseInt(dayB));
                    return dateA - dateB;
                });
            }

            getEventsByMonth() {
                const sorted = this.getSortedEvents();
                const grouped = {};
                sorted.forEach(event => {
                    const monthKey = this.getMonthYear(event.date);
                    if (!grouped[monthKey]) grouped[monthKey] = [];
                    grouped[monthKey].push(event);
                });
                return grouped;
            }

            // RENDER METHODS
            renderPeopleTab() {
                let html = '';
                
                if (this.addingPerson) {
                    html += '<div class="mb-4 bg-white rounded-2xl shadow-sm border border-rose-100 p-4"><h3 class="font-semibold text-gray-900 mb-3">Add New Person</h3><div class="space-y-3"><input type="text" id="newName" placeholder="Full Name" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><input type="text" id="newBirthday" placeholder="Birthday (DD-MM)" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><input type="text" id="newLikes" placeholder="Likes" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><input type="text" id="newDislikes" placeholder="Dislikes" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><textarea id="newNotes" placeholder="Notes" class="w-full p-2 rounded-lg border border-rose-100 text-sm" rows="2"></textarea><div class="flex gap-2"><button onclick="window.app.addPerson(document.getElementById(\'newName\').value, document.getElementById(\'newBirthday\').value, document.getElementById(\'newLikes\').value, document.getElementById(\'newDislikes\').value, document.getElementById(\'newNotes\').value)" class="flex-1 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg font-medium">Add</button><button onclick="window.app.toggleAddPerson()" class="flex-1 py-2 bg-gray-200 hover:bg-gray-300 text-gray-900 rounded-lg font-medium">Cancel</button></div></div></div>';
                }

                this.getSortedPeople().forEach(person => {
                    const isExpanded = this.expandedPerson === person.id;
                    const isEditing = this.editingPerson === person.id;
                    const personGifts = this.getGiftsForPerson(person.fullName);
                    const upcomingAge = this.getUpcomingAge(person);
                    const bdayStr = this.formatDate(person.birthday) + ' (turns ' + upcomingAge + ')';
                    
                    html += '<div class="mb-3 bg-white rounded-2xl shadow-sm border border-rose-100 overflow-hidden"><button onclick="window.app.expandPerson(' + person.id + ')" class="w-full p-4 text-left flex items-center justify-between hover:bg-rose-50/50 transition"><div class="flex-1"><h3 class="font-semibold text-gray-900 text-lg">' + person.fullName + '</h3><p class="text-sm text-gray-600">' + bdayStr + '</p></div><svg class="w-5 h-5 text-rose-400 transition-transform ' + (isExpanded ? 'rotate-180' : '') + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg></button>';

                    if (isExpanded) {
                        if (isEditing) {
                            html += '<div class="border-t border-rose-100 p-4 bg-gradient-to-br from-rose-50/50 to-transparent space-y-3"><input type="text" id="edit_name_' + person.id + '" value="' + person.fullName + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" placeholder="Full Name"><input type="text" id="edit_birthday_' + person.id + '" value="' + person.birthday + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" placeholder="Birthday (DD-MM)"><input type="text" id="edit_likes_' + person.id + '" value="' + (person.likes || '') + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" placeholder="Likes"><input type="text" id="edit_dislikes_' + person.id + '" value="' + (person.dislikes || '') + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" placeholder="Dislikes"><textarea id="edit_notes_' + person.id + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm resize-none" rows="2" placeholder="Notes">' + (person.notes || '') + '</textarea><div class="flex gap-2"><button onclick="window.app.updatePerson(' + person.id + ', { fullName: document.getElementById(\'edit_name_' + person.id + '\').value, birthday: document.getElementById(\'edit_birthday_' + person.id + '\').value, likes: document.getElementById(\'edit_likes_' + person.id + '\').value, dislikes: document.getElementById(\'edit_dislikes_' + person.id + '\').value, notes: document.getElementById(\'edit_notes_' + person.id + '\').value }); window.app.toggleEditPerson(' + person.id + ');" class="flex-1 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium">Save</button><button onclick="window.app.toggleEditPerson(' + person.id + ')" class="flex-1 py-2 bg-gray-200 hover:bg-gray-300 text-gray-900 rounded-lg font-medium">Cancel</button></div></div>';
                        } else {
                            html += '<div class="border-t border-rose-100 p-4 bg-gradient-to-br from-rose-50/50 to-transparent space-y-3"><div class="space-y-2"><div class="bg-yellow-50 rounded p-3 border border-yellow-200"><p class="text-xs uppercase text-yellow-900 tracking-wide font-medium mb-1">Likes</p><p class="text-sm text-yellow-900">' + (person.likes || 'Not specified') + '</p></div><div class="bg-red-50 rounded p-3 border border-red-200"><p class="text-xs uppercase text-red-900 tracking-wide font-medium mb-1">Dislikes</p><p class="text-sm text-red-900">' + (person.dislikes || 'Not specified') + '</p></div><div class="bg-purple-50 rounded p-3 border border-purple-200"><p class="text-xs uppercase text-purple-900 tracking-wide font-medium mb-1">Notes</p><p class="text-sm text-purple-900">' + (person.notes || 'No notes') + '</p></div></div>';
                            
                            html += '<div class="flex items-center gap-3 pt-2"><input type="checkbox" id="christmas_' + person.id + '" ' + (person.includeInChristmas ? 'checked' : '') + ' onchange="window.app.updatePerson(' + person.id + ', { includeInChristmas: this.checked })" class="w-4 h-4 accent-rose-500"><label for="christmas_' + person.id + '" class="text-sm font-medium text-gray-900">Include in Christmas</label></div>';
                            
                            if (personGifts.length > 0) {
                                html += '<div class="border-t border-rose-100 pt-3"><p class="text-xs uppercase text-gray-500 tracking-wide mb-2 font-medium">Gifts assigned:</p><div class="space-y-1">';
                                personGifts.forEach(gift => {
                                    const event = this.events.find(e => e.id === gift.eventId);
                                    html += '<div class="text-sm text-gray-700">• ' + gift.giftName + (event ? ' (' + event.name + ')' : '') + '</div>';
                                });
                                html += '</div></div>';
                            }

                            html += '<div class="flex gap-2"><button onclick="window.app.toggleEditPerson(' + person.id + ')" class="flex-1 py-2 text-sm bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-medium">Edit</button><button onclick="window.app.deletePerson(' + person.id + ')" class="flex-1 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg border border-red-200 font-medium">Remove</button></div>';
                        }
                        html += '</div>';
                    }

                    html += '</div>';
                });

                return html;
            }

            renderEventsTab() {
                let html = '<div class="mb-4 flex flex-col gap-2">';
                html += '<div class="flex gap-2"><button onclick="window.app.showEventType = \'upcoming\'; window.app.showEventReady = \'all\'; window.app.render()" class="px-4 py-2 rounded-lg font-medium text-sm ' + (this.showEventType === 'upcoming' ? 'bg-rose-500 text-white' : 'bg-gray-200 text-gray-900') + '">Upcoming</button><button onclick="window.app.showEventType = \'historic\'; window.app.showEventReady = \'all\'; window.app.render()" class="px-4 py-2 rounded-lg font-medium text-sm ' + (this.showEventType === 'historic' ? 'bg-rose-500 text-white' : 'bg-gray-200 text-gray-900') + '">Historic</button></div>';
                
                if (this.showEventType === 'upcoming') {
                    html += '<div class="flex gap-2"><button onclick="window.app.showEventReady = \'all\'; window.app.render()" class="px-4 py-2 rounded-lg font-medium text-sm ' + (this.showEventReady === 'all' ? 'bg-amber-500 text-white' : 'bg-gray-200 text-gray-900') + '">All</button><button onclick="window.app.showEventReady = \'ready\'; window.app.render()" class="px-4 py-2 rounded-lg font-medium text-sm ' + (this.showEventReady === 'ready' ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-900') + '">Ready</button><button onclick="window.app.showEventReady = \'todo\'; window.app.render()" class="px-4 py-2 rounded-lg font-medium text-sm ' + (this.showEventReady === 'todo' ? 'bg-yellow-500 text-white' : 'bg-gray-200 text-gray-900') + '">To Do</button></div>';
                }
                html += '</div>';

                if (this.addingGift) {
                    const event = this.events.find(e => e.id === this.newGiftEventId);
                    html += '<div class="mb-4 bg-white rounded-2xl shadow-sm border border-rose-100 p-4"><h3 class="font-semibold text-gray-900 mb-3">Add Gift' + (event ? ' for ' + event.name : '') + '</h3><div class="space-y-3"><input type="text" id="giftName" placeholder="Gift name" class="w-full p-2 rounded-lg border border-rose-100 text-sm">';
                    
                    if (event && event.type === 'birthday') {
                        html += '<input type="text" id="giftPerson" value="' + this.newGiftPersonName + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" readonly>';
                    } else if (event && event.type === 'christmas') {
                        html += '<select id="giftChristmasPerson" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><option value="">Select person (optional)</option>' + event.people.map(p => '<option value="' + p.name + '">' + p.name + '</option>').join('') + '</select>';
                    } else {
                        html += '<select id="giftPerson" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><option value="">Person (optional)</option>' + this.people.map(p => '<option value="' + p.fullName + '">' + p.fullName + '</option>').join('') + '</select>';
                    }
                    
                    if (!this.newGiftEventId) {
                        html += '<select id="giftEvent" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><option value="">Event (optional)</option>' + this.events.map(e => '<option value="' + e.id + '">' + e.name + '</option>').join('') + '</select>';
                    }
                    
                    html += '<input type="number" id="giftPrice" placeholder="Price (£)" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><select id="giftStatus" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><option value="not purchased">Not Purchased</option><option value="purchased">Purchased</option></select><div class="flex gap-2"><button onclick="const person = document.getElementById(\'giftChristmasPerson\') ? document.getElementById(\'giftChristmasPerson\').value : (document.getElementById(\'giftPerson\').value || \'\'); const event = ' + (this.newGiftEventId || 'document.getElementById(\'giftEvent\').value') + '; window.app.addGift(document.getElementById(\'giftName\').value, person, event, document.getElementById(\'giftPrice\').value, document.getElementById(\'giftStatus\').value)" class="flex-1 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg font-medium">Add</button><button onclick="window.app.toggleAddGift()" class="flex-1 py-2 bg-gray-200 hover:bg-gray-300 text-gray-900 rounded-lg font-medium">Cancel</button></div></div></div>';
                } else if (this.addingEvent) {
                    if (!this.eventType) {
