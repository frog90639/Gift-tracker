<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; }
        
        .swipe-item {
            position: relative;
            overflow: hidden;
        }
        
        .swipe-item-content {
            display: flex;
            transition: transform 0.3s ease-out;
            touch-action: pan-y;
        }
        
        .swipe-item.swiped .swipe-item-content {
            transform: translateX(-60px);
        }
        
        .swipe-delete {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 60px;
            background-color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app">Loading...</div>

    <script>
        class GiftTracker {
            constructor() {
                const data = this.loadData();
                this.people = data?.people || [];
                this.events = data?.events || [];
                this.gifts = data?.gifts || [];
                this.currentTab = 'events';
                this.expandedPerson = null;
                this.expandedGift = null;
                this.expandedEvent = null;
                this.editingPerson = null;
                this.editingEvent = null;
                this.editingGift = null;
                this.addingPerson = false;
                this.addingEvent = false;
                this.addingGift = false;
                this.eventType = null;
                this.newGiftEventId = null;
                this.newGiftPersonName = null;
                this.showPurchased = 'all';
                this.showEventType = 'upcoming';
                this.showEventReady = 'all';
                this.render();
            }

            loadData() {
                try {
                    const saved = localStorage.getItem('giftTrackerData');
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    console.error('Load error:', e);
                    return null;
                }
            }

            saveData() {
                try {
                    localStorage.setItem('giftTrackerData', JSON.stringify({ 
                        people: this.people, 
                        events: this.events,
                        gifts: this.gifts
                    }));
                } catch (e) {
                    console.error('Save error:', e);
                }
            }

            initSwipeHandlers() {
                setTimeout(() => {
                    document.querySelectorAll('[data-swipe-item]').forEach(el => {
                        let touchStartX = 0;
                        let touchEndX = 0;
                        
                        el.addEventListener('touchstart', (e) => {
                            touchStartX = e.changedTouches[0].screenX;
                        });
                        
                        el.addEventListener('touchend', (e) => {
                            touchEndX = e.changedTouches[0].screenX;
                            if (touchStartX - touchEndX > 50) {
                                el.classList.add('swiped');
                            } else if (touchEndX - touchStartX > 50) {
                                el.classList.remove('swiped');
                            }
                        });
                    });
                }, 100);
            }

            // PEOPLE METHODS
            toggleAddPerson() {
                this.addingPerson = !this.addingPerson;
                this.render();
            }

            addPerson(fullName, birthday, birthYear, likes, dislikes, notes) {
                if (!fullName || !birthday || !birthYear) {
                    alert('Please fill in name, birthday, and birth year');
                    return;
                }
                const newId = Math.max(...this.people.map(p => p.id), 0) + 1;
                this.people.push({
                    id: newId,
                    fullName: fullName,
                    birthday: birthday,
                    birthYear: parseInt(birthYear),
                    likes: likes || '',
                    dislikes: dislikes || '',
                    notes: notes || '',
                    includeInChristmas: false
                });
                this.addingPerson = false;
                this.expandedPerson = newId;
                this.saveData();
                this.render();
            }

            deletePerson(id) {
                this.people = this.people.filter(p => p.id !== id);
                this.saveData();
                this.render();
            }

            updatePerson(id, updates) {
                const person = this.people.find(p => p.id === id);
                if (person) {
                    Object.assign(person, updates);
                    this.saveData();
                    this.render();
                }
            }

            expandPerson(id) {
                this.expandedPerson = this.expandedPerson === id ? null : id;
                this.editingPerson = null;
                this.render();
            }

            toggleEditPerson(id) {
                this.editingPerson = this.editingPerson === id ? null : id;
                this.render();
            }

            getUpcomingAge(person) {
                const today = new Date();
                const [day, month] = person.birthday.split('-');
                let nextBirthday = new Date(today.getFullYear(), parseInt(month) - 1, parseInt(day));
                if (nextBirthday < today) {
                    nextBirthday = new Date(today.getFullYear() + 1, parseInt(month) - 1, parseInt(day));
                }
                return nextBirthday.getFullYear() - person.birthYear;
            }

            formatDate(dateStr) {
                if (!dateStr) return '';
                const [day, month] = dateStr.split('-');
                const date = new Date(2024, parseInt(month) - 1, parseInt(day));
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }

            getMonthYear(dateStr) {
                if (!dateStr) return '';
                const [day, month, year] = dateStr.split('-');
                const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
                return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            }

            // EVENT METHODS
            toggleAddEvent() {
                this.addingEvent = !this.addingEvent;
                this.eventType = null;
                this.render();
            }

            selectEventType(type) {
                this.eventType = type;
                this.render();
            }

            getYearDropdown() {
                const currentYear = new Date().getFullYear();
                let years = '';
                for (let i = currentYear - 7; i <= currentYear + 5; i++) {
                    years += '<option value="' + i + '">' + i + '</option>';
                }
                return years;
            }

            addBirthdayEvent(personId, year) {
                if (!personId || !year) {
                    alert('Please select a person and year');
                    return;
                }
                const person = this.people.find(p => p.id === parseInt(personId));
                if (!person) return;

                const age = parseInt(year) - person.birthYear;
                const eventId = Math.max(...this.events.map(e => e.id), 0) + 1;
                const [day, month] = person.birthday.split('-');
                
                this.events.push({
                    id: eventId,
                    type: 'birthday',
                    name: person.fullName + "'s " + age + this.getOrdinalSuffix(age) + ' birthday',
                    date: day + '-' + month + '-' + year,
                    budget: 0,
                    notes: '',
                    personId: person.id,
                    personName: person.fullName,
                    year: parseInt(year),
                    people: [{ name: person.fullName, budget: 0 }],
                    giftIds: []
                });
                this.addingEvent = false;
                this.eventType = null;
                this.saveData();
                this.render();
            }

            addChristmasEvent(year, totalBudget) {
                if (!year) {
                    alert('Please select a year');
                    return;
                }
                const christmasPeople = this.people.filter(p => p.includeInChristmas).map(p => ({
                    name: p.fullName,
                    budget: 0
                }));

                const eventId = Math.max(...this.events.map(e => e.id), 0) + 1;
                
                this.events.push({
                    id: eventId,
                    type: 'christmas',
                    name: 'Christmas ' + year,
                    date: '25-12-' + year,
                    budget: parseFloat(totalBudget) || 0,
                    notes: '',
                    year: parseInt(year),
                    people: christmasPeople,
                    giftIds: []
                });
                this.addingEvent = false;
                this.eventType = null;
                this.saveData();
                this.render();
            }

            updateEvent(id, updates) {
                const event = this.events.find(e => e.id === id);
                if (event) {
                    Object.assign(event, updates);
                    this.saveData();
                    this.render();
                }
            }

            deleteEvent(id) {
                this.events = this.events.filter(e => e.id !== id);
                this.gifts = this.gifts.filter(g => g.eventId !== id);
                this.saveData();
                this.render();
            }

            expandEvent(id) {
                this.expandedEvent = this.expandedEvent === id ? null : id;
                this.editingEvent = null;
                this.render();
            }

            toggleEditEvent(id) {
                this.editingEvent = this.editingEvent === id ? null : id;
                this.render();
            }

            addGiftToEvent(eventId, giftId) {
                const event = this.events.find(e => e.id === eventId);
                const gift = this.gifts.find(g => g.id === giftId);
                if (event && gift) {
                    if (!event.giftIds) event.giftIds = [];
                    if (!event.giftIds.includes(giftId)) {
                        event.giftIds.push(giftId);
                        gift.eventId = eventId;
                        this.saveData();
                        this.render();
                    }
                }
            }

            removeGiftFromEvent(eventId, giftId) {
                const event = this.events.find(e => e.id === eventId);
                if (event) {
                    event.giftIds = event.giftIds.filter(id => id !== giftId);
                    this.saveData();
                    this.render();
                }
            }

            addPersonToChristmas(eventId, personName) {
                const event = this.events.find(e => e.id === eventId);
                if (event && event.type === 'christmas') {
                    if (!event.people.find(p => p.name === personName)) {
                        event.people.push({ name: personName, budget: 0 });
                        this.saveData();
                        this.render();
                    }
                }
            }

            removePersonFromChristmas(eventId, personName) {
                const event = this.events.find(e => e.id === eventId);
                if (event && event.type === 'christmas') {
                    event.people = event.people.filter(p => p.name !== personName);
                    this.saveData();
                    this.render();
                }
            }

            getBudgetStatus(event) {
                const eventGifts = this.getGiftsForEvent(event.id);
                const spent = eventGifts.reduce((sum, g) => sum + g.price, 0);
                
                if (event.budget === 0) return '';
                if (spent === 0) return '<span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">No spending</span>';
                if (spent > event.budget) return '<span class="text-xs bg-red-100 text-red-800 px-2 py-1 rounded-full">Over budget</span>';
                if (spent === event.budget) return '<span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full">At budget</span>';
                return '<span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full">Within budget</span>';
            }

            isEventReady(event) {
                const eventGifts = this.getGiftsForEvent(event.id);
                return eventGifts.some(g => g.status === 'purchased');
            }

            // GIFT METHODS
            toggleAddGift() {
                this.addingGift = !this.addingGift;
                this.newGiftEventId = null;
                this.newGiftPersonName = null;
                this.render();
            }

            startNewGiftForEvent(eventId, personName = null) {
                this.addingGift = true;
                this.newGiftEventId = eventId;
                this.newGiftPersonName = personName;
                this.render();
            }

            addGift(giftName, personName, eventId, price, status) {
                if (!giftName) {
                    alert('Please enter a gift name');
                    return;
                }
                const newId = Math.max(...this.gifts.map(g => g.id), 0) + 1;
                const event = this.events.find(e => e.id === parseInt(eventId));
                
                this.gifts.push({
                    id: newId,
                    giftName: giftName,
                    personName: personName || '',
                    eventId: eventId ? parseInt(eventId) : null,
                    status: status || 'not purchased',
                    price: parseFloat(price) || 0,
                    url: '',
                    notes: ''
                });
                this.addingGift = false;
                this.newGiftEventId = null;
                this.newGiftPersonName = null;
                this.saveData();
                this.render();
            }

            updateGift(id, updates) {
                const gift = this.gifts.find(g => g.id === id);
                if (gift) {
                    Object.assign(gift, updates);
                    this.saveData();
                    this.render();
                }
            }

            deleteGift(id) {
                this.gifts = this.gifts.filter(g => g.id !== id);
                this.events.forEach(e => {
                    if (e.giftIds) e.giftIds = e.giftIds.filter(gId => gId !== id);
                });
                this.saveData();
                this.render();
            }

            expandGift(id) {
                this.expandedGift = this.expandedGift === id ? null : id;
                this.editingGift = null;
                this.render();
            }

            toggleEditGift(id) {
                this.editingGift = this.editingGift === id ? null : id;
                this.render();
            }

            getGiftsForEvent(eventId) {
                return this.gifts.filter(g => g.eventId === eventId);
            }

            getGiftsForPerson(personName) {
                return this.gifts.filter(g => g.personName === personName);
            }

            getGiftsForEventAndPerson(eventId, personName) {
                return this.gifts.filter(g => g.eventId === eventId && g.personName === personName);
            }

            isEventUpcoming(event) {
                const [day, month, year] = event.date.split('-');
                const eventDate = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
                return eventDate >= new Date();
            }

            getOrdinalSuffix(num) {
                if (num > 3 && num < 21) return 'th';
                switch (num % 10) {
                    case 1: return 'st';
                    case 2: return 'nd';
                    case 3: return 'rd';
                    default: return 'th';
                }
            }

            getSortedPeople() {
                return [...this.people].sort((a, b) => a.fullName.localeCompare(b.fullName));
            }

            getSortedEvents() {
                return [...this.events].sort((a, b) => {
                    const [dayA, monthA, yearA] = a.date.split('-');
                    const [dayB, monthB, yearB] = b.date.split('-');
                    const dateA = new Date(parseInt(yearA), parseInt(monthA) - 1, parseInt(dayA));
                    const dateB = new Date(parseInt(yearB), parseInt(monthB) - 1, parseInt(dayB));
                    return dateA - dateB;
                });
            }

            // REPORTING METHODS
            getTotalSpent() {
                return this.gifts.reduce((sum, g) => sum + g.price, 0);
            }

            getAverageBirthdaySpend() {
                const birthdayEvents = this.events.filter(e => e.type === 'birthday');
                if (birthdayEvents.length === 0) return 0;
                const birthdaySpend = birthdayEvents.reduce((sum, e) => {
                    const eventGifts = this.getGiftsForEvent(e.id);
                    return sum + eventGifts.reduce((s, g) => s + g.price, 0);
                }, 0);
                return (birthdaySpend / birthdayEvents.length).toFixed(2);
            }

            getAverageChristmasSpend() {
                const christmasEvents = this.events.filter(e => e.type === 'christmas');
                if (christmasEvents.length === 0) return 0;
                const christmasSpend = christmasEvents.reduce((sum, e) => {
                    const eventGifts = this.getGiftsForEvent(e.id);
                    return sum + eventGifts.reduce((s, g) => s + g.price, 0);
                }, 0);
                return (christmasSpend / christmasEvents.length).toFixed(2);
            }

            getTopGiftees() {
                const giftsPerPerson = {};
                this.gifts.forEach(gift => {
                    if (gift.personName) {
                        if (!giftsPerPerson[gift.personName]) {
                            giftsPerPerson[gift.personName] = { count: 0, spent: 0 };
                        }
                        giftsPerPerson[gift.personName].count++;
                        giftsPerPerson[gift.personName].spent += gift.price;
                    }
                });
                return Object.entries(giftsPerPerson)
                    .map(([name, data]) => ({ name, ...data }))
                    .sort((a, b) => b.spent - a.spent)
                    .slice(0, 5);
            }

            getPurchasedVsUnpurchased() {
                const purchased = this.gifts.filter(g => g.status === 'purchased').length;
                const unpurchased = this.gifts.filter(g => g.status === 'not purchased').length;
                return { purchased, unpurchased, total: purchased + unpurchased };
            }

            renderReportingTab() {
                const totalSpent = this.getTotalSpent();
                const avgBirthday = this.getAverageBirthdaySpend();
                const avgChristmas = this.getAverageChristmasSpend();
                const topGiftees = this.getTopGiftees();
                const { purchased, unpurchased, total } = this.getPurchasedVsUnpurchased();
                const birthdays = this.events.filter(e => e.type === 'birthday').length;
                const christmas = this.events.filter(e => e.type === 'christmas').length;

                let html = '<div class="space-y-4">';

                html += '<div class="grid grid-cols-2 gap-3"><div class="bg-gradient-to-br from-rose-100 to-rose-50 rounded-2xl p-4 border border-rose-200"><p class="text-xs uppercase text-rose-900 tracking-wide font-bold mb-1">Total Spent</p><p class="text-2xl font-bold text-rose-900">£' + totalSpent.toFixed(2) + '</p></div><div class="bg-gradient-to-br from-amber-100 to-amber-50 rounded-2xl p-4 border border-amber-200"><p class="text-xs uppercase text-amber-900 tracking-wide font-bold mb-1">Total Gifts</p><p class="text-2xl font-bold text-amber-900">' + total + '</p></div></div>';

                html += '<div class="grid grid-cols-2 gap-3"><div class="bg-white rounded-2xl p-4 border border-gray-200"><p class="text-xs uppercase text-gray-600 tracking-wide font-bold mb-1">Birthdays</p><p class="text-2xl font-bold text-gray-900">' + birthdays + '</p></div><div class="bg-white rounded-2xl p-4 border border-gray-200"><p class="text-xs uppercase text-gray-600 tracking-wide font-bold mb-1">Christmas</p><p class="text-2xl font-bold text-gray-900">' + christmas + '</p></div></div>';

                html += '<div class="grid grid-cols-2 gap-3"><div class="bg-gradient-to-br from-blue-100 to-blue-50 rounded-2xl p-4 border border-blue-200"><p class="text-xs uppercase text-blue-900 tracking-wide font-bold mb-1">Avg Birthday</p><p class="text-xl font-bold text-blue-900">£' + avgBirthday + '</p></div><div class="bg-gradient-to-br from-green-100 to-green-50 rounded-2xl p-4 border border-green-200"><p class="text-xs uppercase text-green-900 tracking-wide font-bold mb-1">Avg Christmas</p><p class="text-xl font-bold text-green-900">£' + avgChristmas + '</p></div></div>';

                html += '<div class="bg-white rounded-2xl p-4 border border-gray-200"><p class="text-xs uppercase text-gray-600 tracking-wide font-bold mb-3">Purchase Status</p><div class="space-y-2"><div class="flex items-center justify-between"><span class="text-sm text-gray-700">Purchased</span><span class="text-sm font-bold text-green-600">✓ ' + purchased + '</span></div><div class="flex items-center justify-between"><span class="text-sm text-gray-700">Not Purchased</span><span class="text-sm font-bold text-yellow-600">○ ' + unpurchased + '</span></div><div class="w-full bg-gray-200 rounded-full h-2 mt-2"><div class="bg-green-500 h-2 rounded-full" style="width: ' + (total > 0 ? (purchased / total * 100) : 0) + '%"></div></div></div></div>';

                if (topGiftees.length > 0) {
                    html += '<div class="bg-white rounded-2xl p-4 border border-gray-200"><p class="text-xs uppercase text-gray-600 tracking-wide font-bold mb-3">Top Recipients</p><div class="space-y-2">';
                    topGiftees.forEach((giftee, idx) => {
                        html += '<div class="flex items-center justify-between pb-2' + (idx < topGiftees.length - 1 ? ' border-b border-gray-100' : '') + '"><div><p class="text-sm font-medium text-gray-900">' + (idx + 1) + '. ' + giftee.name + '</p><p class="text-xs text-gray-500">' + giftee.count + ' gift' + (giftee.count > 1 ? 's' : '') + '</p></div><p class="text-sm font-bold text-rose-600">£' + giftee.spent.toFixed(2) + '</p></div>';
                    });
                    html += '</div></div>';
                }

                html += '</div>';
                return html;
            }

            renderPeopleTab() {
                let html = '';
                
                if (this.addingPerson) {
                    html += '<div class="mb-4 bg-white rounded-2xl shadow-sm border border-rose-100 p-4"><h3 class="font-semibold text-gray-900 mb-3">Add New Person</h3><div class="space-y-3"><input type="text" id="newName" placeholder="Full Name" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><input type="text" id="newBirthday" placeholder="Birthday (DD-MM)" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><input type="number" id="newBirthYear" placeholder="Birth Year" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><input type="text" id="newLikes" placeholder="Likes" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><input type="text" id="newDislikes" placeholder="Dislikes" class="w-full p-2 rounded-lg border border-rose-100 text-sm"><textarea id="newNotes" placeholder="Notes" class="w-full p-2 rounded-lg border border-rose-100 text-sm" rows="2"></textarea><div class="flex gap-2"><button onclick="window.app.addPerson(document.getElementById(\'newName\').value, document.getElementById(\'newBirthday\').value, document.getElementById(\'newBirthYear\').value, document.getElementById(\'newLikes\').value, document.getElementById(\'newDislikes\').value, document.getElementById(\'newNotes\').value)" class="flex-1 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg font-medium">Add</button><button onclick="window.app.toggleAddPerson()" class="flex-1 py-2 bg-gray-200 hover:bg-gray-300 text-gray-900 rounded-lg font-medium">Cancel</button></div></div></div>';
                }

                this.getSortedPeople().forEach(person => {
                    const isExpanded = this.expandedPerson === person.id;
                    const isEditing = this.editingPerson === person.id;
                    const personGifts = this.getGiftsForPerson(person.fullName);
                    const upcomingAge = this.getUpcomingAge(person);
                    const bdayStr = this.formatDate(person.birthday) + ' ' + person.birthYear + ' (turns ' + upcomingAge + ')';
                    const totalSpentOnPerson = personGifts.reduce((sum, g) => sum + g.price, 0);
                    
                    html += '<div class="mb-3 swipe-item" data-swipe-item data-person-id="' + person.id + '"><div class="swipe-item-content bg-white rounded-2xl shadow-sm border border-rose-100 overflow-hidden"><div class="w-full"><button onclick="window.app.expandPerson(' + person.id + ')" class="w-full p-4 text-left flex items-center justify-between hover:bg-rose-50/50 transition"><div class="flex-1"><h3 class="font-semibold text-gray-900 text-lg">' + person.fullName + '</h3><p class="text-sm text-gray-600">' + bdayStr + '</p></div><svg class="w-5 h-5 text-rose-400 transition-transform ' + (isExpanded ? 'rotate-180' : '') + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg></button>';

                        if (isExpanded) {
                            if (isEditing) {
                                html += '<div class="border-t border-rose-100 p-4 bg-gradient-to-br from-rose-50/50 to-transparent space-y-3"><input type="text" id="edit_name_' + person.id + '" value="' + person.fullName + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" placeholder="Full Name"><input type="text" id="edit_birthday_' + person.id + '" value="' + person.birthday + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" placeholder="Birthday (DD-MM)"><input type="number" id="edit_birthyear_' + person.id + '" value="' + person.birthYear + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" placeholder="Birth Year"><input type="text" id="edit_likes_' + person.id + '" value="' + (person.likes || '') + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" placeholder="Likes"><input type="text" id="edit_dislikes_' + person.id + '" value="' + (person.dislikes || '') + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm" placeholder="Dislikes"><textarea id="edit_notes_' + person.id + '" class="w-full p-2 rounded-lg border border-rose-100 text-sm resize-none" rows="2" placeholder="Notes">' + (person.notes || '') + '</textarea><div class="flex gap-2"><button onclick="window.app.updatePerson(' + person.id + ', { fullName: document.getElementById(\'edit_name_' + person.id + '\').value, birthday: document.getElementById(\'edit_birthday_' + person.id + '\').value, birthYear: parseInt(document.getElementById(\'edit_birthyear_' + person.id + '\').value), likes: document.getElementById(\'edit_likes_' + person.id + '\').value, dislikes: document.getElementById(\'edit_dislikes_' + person.id + '\').value, notes: document.getElementById(\'edit_notes_' + person.id + '\').value }); window.app.toggleEditPerson(' + person.id + ');" class="flex-1 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium">Save</button><button onclick="window.app.toggleEditPerson(' + person.id + ')" class="flex-1 py-2 bg-gray-200 hover:bg-gray-300 text-gray-900 rounded-lg font-medium">Cancel</button></div></div>';
                            } else {
                                html += '<div class="border-t border-rose-100 p-4 bg-gradient-to-br from-rose-50/50 to-transparent space-y-3"><div class="space-y-2"><div class="bg-yellow-50 rounded p-3 border border-yellow-200"><p class="text-xs uppercase text-yellow-900 tracking-wide font-medium mb-1">Likes</p><p class="text-sm text-yellow-900">' + (person.likes || 'Not specified') + '</p></div><div class="bg-red-50 rounded p-3 border border-red-200"><p class="text-xs uppercase text-red-900 tracking-wide font-medium mb-1">Dislikes</p><p class="text-sm text-red-900">' + (person.dislikes || 'Not specified') + '</p></div><div class="bg-purple-50 rounded p-3 border border-purple-200"><p class="text-xs uppercase text-purple-900 tracking-wide font-medium mb-1">Notes</p><p class="text-sm text-purple-900">' + (person.notes || 'No notes') + '</p></div></div>';
                                
                                html += '<div class="flex items-center gap-3 pt-2"><input type="checkbox" id="christmas_' + person.id + '" ' + (person.includeInChristmas ? 'checked' : '') + ' onchange="window.app.updatePerson(' + person.id + ', { includeInChristmas: this.checked })" class="w-4 h-4 accent-rose-500"><label for="christmas_' + person.id + '" class="text-sm font-medium text-gray-900">Include in Christmas</label></div>';
                                
                                if (personGifts.length > 0) {
                                    html += '<div class="border-t border-rose-100 pt-3"><p class="text-xs uppercase text-gray-500 tracking-wide mb-2 font-medium">Gifts assigned (£' + totalSpentOnPerson.toFixed(2) + '):</p><div class="space-y-1">';
                                    personGifts.forEach(gift => {
                                        const event = this.events.find(e => e.id === gift.eventId);
                                        html += '<div class="text-sm text-gray-700">• ' + gift.giftName + ' - £' + gift.price.toFixed(2) + (event ? ' (' + event.name + ')' : '') + '</div>';
                                    });
                                    html += '</div></div>';
                                }

                                html += '<div class="flex gap-2"><button onclick="window.app.toggleEditPerson(' + person.id + ')" class="flex-1 py-2 text-sm bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-medium">Edit</button><button onclick="document.querySelector(\'[data-person-id=\\"' + person.id + '\\"]\').classList.add(\'swiped\')" class="flex-1 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg border border-red-200 font-medium">Delete</button></div>';
                            }
                            html += '</div>';
                        }
                        html += '</div></div>';
                        html += '<div class="swipe-delete" onclick="window.app.deletePerson(' + person.id + ')">Delete</div>';
                        html += '</div>';
                    });

                return html;
            }

            render() {
                let tabContent = '';
                
                if (this.currentTab === 'events') {
                    tabContent = this.renderEventsTab ? this.renderEventsTab() : '';
                } else if (this.currentTab === 'people') {
                    tabContent = this.renderPeopleTab();
                } else if (this.currentTab === 'gifts') {
                    tabContent = this.renderGiftsTab ? this.renderGiftsTab() : '';
                } else if (this.currentTab === 'reporting') {
                    tabContent = this.renderReportingTab();
                }

                const html = '<div class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-amber-50"><div class="sticky top-0 z-10 bg-white/80 backdrop-blur-lg border-b border-rose-100"><div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between"><div class="flex items-center gap-2"><svg class="w-6 h-6 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v-1m0 0a3 3 0 100 6 3 3 0 000-6zm0 0V5m0 0a3 3 0 00-3 3v1m3-1a3 3 0 013 3v1"></path></svg><h1 class="text-2xl font-bold text-gray-900">Gift Tracker</h1></div><button onclick="window.app.currentTab === \'events\' ? window.app.toggleAddEvent() : (window.app.currentTab === \'people\' ? window.app.toggleAddPerson() : (window.app.currentTab === \'gifts\' ? window.app.toggleAddGift() : null))" class="bg-rose-500 hover:bg-rose-600 text-white rounded-full p-2 transition shadow-md"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></button></div><div class="max-w-2xl mx-auto px-4 flex gap-2 border-t border-rose-100 overflow-x-auto"><button onclick="window.app.currentTab = \'events\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap ' + (this.currentTab === 'events' ? 'text-rose-600 border-b-2 border-rose-600' : 'text-gray-600 hover:text-gray-900') + '">Events</button><button onclick="window.app.currentTab = \'people\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap ' + (this.currentTab === 'people' ? 'text-rose-600 border-b-2 border-rose-600' : 'text-gray-600 hover:text-gray-900') + '">People</button><button onclick="window.app.currentTab = \'gifts\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap ' + (this.currentTab === 'gifts' ? 'text-rose-600 border-b-2 border-rose-600' : 'text-gray-600 hover:text-gray-900') + '">Gifts</button><button onclick="window.app.currentTab = \'reporting\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap ' + (this.currentTab === 'reporting' ? 'text-rose-600 border-b-2 border-rose-600' : 'text-gray-600 hover:text-gray-900') + '">Reporting</button></div></div><div class="max-w-2xl mx-auto px-4 py-6 pb-20">' + tabContent + '</div></div>';

                document.getElementById('app').innerHTML = html;
                this.initSwipeHandlers();
            }

            renderEventsTab() {
                return '<div class="text-center py-12"><p class="text-gray-500">Events tab content</p></div>';
            }

            renderGiftsTab() {
                return '<div class="text-center py-12"><p class="text-gray-500">Gifts tab content</p></div>';
            }
        }

        window.app = new GiftTracker();
    </script>
</body>
</html>
