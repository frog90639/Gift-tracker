<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx@latest/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        :root {
            --color-bg: #FFF8F0;
            --color-surface: #FFFFFF;
            --color-primary: #FF6B9D;
            --color-primary-text: #FFFFFF;
            --color-secondary: #FFE66D;
            --color-accent: #00D9FF;
            --color-text: #2D3436;
            --color-text-muted: #636E72;
            --color-border: #DFE6E9;
            --color-success: #00E676;
            --color-warning: #FFA500;
            --color-error: #FF4757;
        }
        * { font-family: 'Poppins', sans-serif; }
        body { background-color: var(--color-bg); }
        .swipe-item { position: relative; overflow: hidden; }
        .swipe-item-content { display: flex; transition: transform 0.3s ease-out; touch-action: pan-y; }
        .swipe-item.swiped .swipe-item-content { transform: translateX(calc(0px - 60px)); }
        .swipe-delete { position: absolute; right: 0; top: 0; bottom: 0; width: 60px; background-color: var(--color-error); display: none; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .swipe-item.swiped .swipe-delete { display: flex; }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
class GiftTracker {
    constructor() {
        const data = this.loadData();
        this.people = data?.people || [];
        this.events = data?.events || [];
        this.gifts = data?.gifts || [];
        this.shops = data?.shops || [];
        this.currentTab = 'events';
        this.expandedPerson = null;
        this.expandedEvent = null;
        this.expandedGift = null;
        this.editingPerson = null;
        this.editingEvent = null;
        this.editingGift = null;
        this.addingPerson = false;
        this.addingEvent = false;
        this.addingGift = false;
        this.eventType = null;
        this.newGiftEventId = null;
        this.newGiftPersonName = null;
        this.giftFormState = { giftName: '', person: '', event: '', price: '', shop: '', notes: '', status: 'idea', url: '' };
        this.showGiftStatus = 'all';
        this.showEventType = 'upcoming';
        this.showEventReady = 'all';
        this.showEventCompleted = 'all';
        this.showSettings = false;
        this.searchText = '';
        this.render();
    }
    loadData() { try { return JSON.parse(localStorage.getItem('giftTrackerData')); } catch(e) { return null; } }
    saveData() { try { localStorage.setItem('giftTrackerData', JSON.stringify({people: this.people, events: this.events, gifts: this.gifts, shops: this.shops})); } catch(e) {} }
    initSwipeHandlers() {
        setTimeout(() => {
            document.querySelectorAll('[data-swipe-item]').forEach(el => {
                let touchStartX = 0, touchEndX = 0;
                el.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
                el.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    if (touchStartX - touchEndX > 50) el.classList.add('swiped');
                    else if (touchEndX - touchStartX > 50) el.classList.remove('swiped');
                });
            });
        }, 100);
    }
    setSearchText(text) { this.searchText = text.toLowerCase(); this.render(); }
    filterPeopleBySearch(people) { if (!this.searchText) return people; return people.filter(p => p.fullName.toLowerCase().includes(this.searchText) || p.likes.toLowerCase().includes(this.searchText) || p.dislikes.toLowerCase().includes(this.searchText)); }
    filterGiftsBySearch(gifts) { if (!this.searchText) return gifts; return gifts.filter(g => g.giftName.toLowerCase().includes(this.searchText) || g.personName.toLowerCase().includes(this.searchText)); }
    toggleAddPerson() { this.addingPerson = !this.addingPerson; this.render(); }
    addPerson(name, bday, year, likes, dislikes, notes, messageOnly, fyiOnly) {
        if (!name || !bday || !year) return alert('Need name, birthday (DD-MM), year');
        this.people.push({ id: Math.max(...this.people.map(p => p.id), 0) + 1, fullName: name, birthday: bday, birthYear: parseInt(year), likes: likes || '', dislikes: dislikes || '', notes: notes || '', giftHistory: [], includeInChristmas: false, messageOnly: messageOnly || false, fyiOnly: fyiOnly || false });
        this.addingPerson = false; this.saveData(); this.render();
    }
    deletePerson(id) { this.people = this.people.filter(p => p.id !== id); this.saveData(); this.render(); }
    updatePerson(id, updates) { const p = this.people.find(x => x.id === id); if (p) Object.assign(p, updates); this.saveData(); this.render(); }
    expandPerson(id) { this.expandedPerson = this.expandedPerson === id ? null : id; this.editingPerson = null; this.render(); }
    toggleEditPerson(id) { this.editingPerson = this.editingPerson === id ? null : id; this.render(); }
    formatDate(ddmm, year) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const [day, month] = ddmm.split('-');
        return day + ' ' + months[parseInt(month) - 1] + ' ' + year;
    }
    getDaysUntil(person) {
        const today = new Date();
        const [day, month] = person.birthday.split('-');
        let birthdayThisYear = new Date(today.getFullYear(), parseInt(month) - 1, parseInt(day));
        if (birthdayThisYear < today) birthdayThisYear = new Date(today.getFullYear() + 1, parseInt(month) - 1, parseInt(day));
        const christmasThisYear = new Date(today.getFullYear(), 11, 25);
        let christmasNext = christmasThisYear;
        if (today > christmasThisYear) christmasNext = new Date(today.getFullYear() + 1, 11, 25);
        if (person.includeInChristmas) {
            const nextDate = birthdayThisYear <= christmasNext ? birthdayThisYear : christmasNext;
            const daysLeft = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
            return daysLeft;
        } else {
            const daysLeft = Math.ceil((birthdayThisYear - today) / (1000 * 60 * 60 * 24));
            return daysLeft;
        }
    }
    getNextEvent(person) {
        const today = new Date();
        const [day, month] = person.birthday.split('-');
        let birthdayThisYear = new Date(today.getFullYear(), parseInt(month) - 1, parseInt(day));
        if (birthdayThisYear < today) birthdayThisYear = new Date(today.getFullYear() + 1, parseInt(month) - 1, parseInt(day));
        if (!person.includeInChristmas) {
            return this.formatDate(person.birthday, birthdayThisYear.getFullYear()) + ' (Birthday)';
        }
        const christmasThisYear = new Date(today.getFullYear(), 11, 25);
        let christmasNext = christmasThisYear;
        if (today > christmasThisYear) christmasNext = new Date(today.getFullYear() + 1, 11, 25);
        if (birthdayThisYear <= christmasNext) {
            return this.formatDate(person.birthday, birthdayThisYear.getFullYear()) + ' (Birthday)';
        } else {
            return '25 Dec (Christmas)';
        }
    }
    toggleAddEvent() { this.addingEvent = !this.addingEvent; this.eventType = null; this.render(); }
    selectEventType(type) { this.eventType = type; this.render(); }
    addCustomEvent(name, date, budget, person) {
        if (!name || !date) return alert('Event name and date required');
        const parts = date.split('-');
        if (parts.length !== 3) return alert('Date must be DD-MM-YYYY');
        const pid = person ? parseInt(person) : null;
        const pname = pid ? (this.people.find(p => p.id === pid)?.fullName || '') : '';
        this.events.push({ id: Math.max(...this.events.map(e => e.id), 0) + 1, type: 'custom', name: name, date: parts[0] + '-' + parts[1] + '-' + parts[2], budget: parseFloat(budget) || 0, notes: '', personId: pid, personName: pname, year: parseInt(parts[2]), people: pid ? [{name: pname, budget: 0}] : [], giftIds: [] });
        this.addingEvent = false; this.eventType = null; this.saveData(); this.render();
    }
    getYearDropdown() { const y = new Date().getFullYear(); let s = ''; for (let i = y - 7; i <= y + 5; i++) s += '<option value="' + i + '">' + i + '</option>'; return s; }
    addBirthdayEvent(pid, year) {
        if (!pid || !year) return alert('Select person and year');
        const p = this.people.find(x => x.id === parseInt(pid));
        if (!p) return;
        const age = parseInt(year) - p.birthYear;
        const parts = p.birthday.split('-');
        this.events.push({ id: Math.max(...this.events.map(e => e.id), 0) + 1, type: 'birthday', name: p.fullName + ': ' + age, date: parts[0] + '-' + parts[1] + '-' + year, budget: 0, notes: '', personId: p.id, personName: p.fullName, year: parseInt(year), people: [{name: p.fullName, budget: 0}], giftIds: [], giftAssignments: [], messages: p.messageOnly ? [] : undefined });
        this.addingEvent = false; this.eventType = null; this.saveData(); this.render();
    }
    addChristmasEvent(year, budget) {
        if (!year) return alert('Select year');
        year = parseInt(year);
        const christmasDate = new Date(year, 11, 25); // December 25
        const cp = this.people.filter(p => {
            if (!p.includeInChristmas) return false;
            // Check if their birthday has passed in the Christmas year
            const [day, month] = p.birthday.split('-');
            const birthdayInYear = new Date(year, parseInt(month) - 1, parseInt(day));
            return birthdayInYear <= christmasDate;
        }).map(p => ({name: p.fullName, budget: 0}));
        this.events.push({ id: Math.max(...this.events.map(e => e.id), 0) + 1, type: 'christmas', name: 'Christmas ' + year, date: '25-12-' + year, budget: parseFloat(budget) || 0, notes: '', year: parseInt(year), people: cp, giftIds: [], giftAssignments: [] });
        this.addingEvent = false; this.eventType = null; this.saveData(); this.render();
    }
    createAllEventsForYear(year) {
        if (!year) return alert('Select year');
        year = parseInt(year);
        let created = 0;
        this.people.filter(p => !p.fyiOnly).forEach(p => {
            if (!this.events.find(e => e.type === 'birthday' && e.personId === p.id && e.year === year)) {
                this.addBirthdayEvent(p.id, year);
                created++;
            }
        });
        if (!this.events.find(e => e.type === 'christmas' && e.year === year)) {
            this.addChristmasEvent(year, 0);
            created++;
        }
        this.showSettings = false;
        alert('Created ' + created + ' event(s)');
        this.render();
    }
    updateEvent(id, updates) { const e = this.events.find(x => x.id === id); if (e) Object.assign(e, updates); this.saveData(); this.render(); }
    deleteEvent(id) { this.events = this.events.filter(e => e.id !== id); this.gifts = this.gifts.filter(g => g.eventId !== id); this.saveData(); this.render(); }
    expandEvent(id) { this.expandedEvent = this.expandedEvent === id ? null : id; this.editingEvent = null; this.render(); }
    toggleEditEvent(id) { this.editingEvent = this.editingEvent === id ? null : id; this.render(); }
    isEventReady(e) { return this.getGiftsForEvent(e.id).some(g => ['bought', 'wrapped', 'gifted'].includes(g.status)); }
    isEventCompleted(e) {
        const person = e.personId ? this.people.find(p => p.id === e.personId) : null;
        const isMessageOnly = person && person.messageOnly;
        if (isMessageOnly) {
            return e.messaged === true;
        } else {
            const gifts = this.getGiftsForEvent(e.id);
            return gifts.length > 0 && gifts.every(g => g.status === 'gifted');
        }
    }
    addGiftToEvent(eid, gid, personName) { 
        const e = this.events.find(x => x.id === eid); 
        const g = this.gifts.find(x => x.id === gid); 
        if (e && g) { 
            if (!e.giftAssignments) e.giftAssignments = [];
            if (!e.giftAssignments.find(ga => ga.giftId === gid && ga.personName === personName)) { 
                e.giftAssignments.push({giftId: gid, personName: personName});
                if (!e.giftIds) e.giftIds = [];
                if (!e.giftIds.includes(gid)) e.giftIds.push(gid);
                g.eventId = eid; 
                this.saveData(); 
                this.render(); 
            } 
        } 
    }
    removeGiftFromEvent(eid, gid) { 
        const e = this.events.find(x => x.id === eid); 
        if (e) { 
            if (e.giftAssignments) e.giftAssignments = e.giftAssignments.filter(ga => ga.giftId !== gid);
            if (e.giftIds) e.giftIds = e.giftIds.filter(id => id !== gid); 
            this.saveData(); 
            this.render(); 
        } 
    }
    addMessageToEvent(eid, personName) {
        if (!personName) return alert('Person name required');
        const e = this.events.find(x => x.id === eid);
        if (e) {
            if (!e.messages) e.messages = [];
            if (!e.messages.find(m => m.personName === personName)) {
                e.messages.push({id: Math.max(...(e.messages.map(m => m.id) || [0])), personName: personName, done: false});
                this.saveData();
                this.render();
            } else {
                alert('Already added for this person');
            }
        }
    }
    toggleMessageDone(eid, mid) {
        const e = this.events.find(x => x.id === eid);
        if (e && e.messages) {
            const m = e.messages.find(msg => msg.id === mid);
            if (m) m.done = !m.done;
            this.saveData();
            this.render();
        }
    }
    deleteMessageFromEvent(eid, mid) {
        const e = this.events.find(x => x.id === eid);
        if (e && e.messages) {
            e.messages = e.messages.filter(m => m.id !== mid);
            this.saveData();
            this.render();
        }
    }
    getBudgetStatus(e) {
        const spent = this.getGiftsForEvent(e.id).reduce((s, g) => s + g.price, 0);
        if (e.budget === 0) return '';
        if (spent === 0) return '<span style="background-color: var(--color-secondary); color: var(--color-text); padding: 2px 8px; border-radius: 4px; font-size: 12px;">No spending</span>';
        if (spent > e.budget) return '<span style="background-color: #FFE5E0; color: var(--color-error); padding: 2px 8px; border-radius: 4px; font-size: 12px;">Over budget</span>';
        return '<span style="background-color: #D5E8E0; color: var(--color-success); padding: 2px 8px; border-radius: 4px; font-size: 12px;">Within budget</span>';
    }
    toggleAddGift() { this.addingGift = !this.addingGift; this.newGiftEventId = null; this.newGiftPersonName = null; this.render(); }
    addShop(shopName) {
        if (!shopName || !shopName.trim()) return;
        const trimmed = shopName.trim();
        if (!this.shops.includes(trimmed)) {
            this.shops.push(trimmed);
            this.saveData();
        }
        this.render();
    }
    deleteShop(index) {
        this.shops.splice(index, 1);
        this.saveData();
        this.render();
    }
    toggleSettings() { this.showSettings = !this.showSettings; this.render(); }
    addGift(name, person, eid, price, status, category, url, notes, shop) {
        if (!name) return alert('Enter gift name');
        const gid = Math.max(...this.gifts.map(g => g.id), 0) + 1;
        this.gifts.push({ id: gid, giftName: name, personName: person || '', eventId: eid ? parseInt(eid) : null, status: status || 'idea', price: parseFloat(price) || 0, url: url || '', notes: notes || '', category: category || 'other', shop: shop || '', photoUrl: '', purchaseYear: new Date().getFullYear() });
        if (person) {
            const p = this.people.find(x => x.fullName === person);
            if (p) {
                if (!p.giftHistory) p.giftHistory = [];
                p.giftHistory.push({giftName: name, price: parseFloat(price) || 0, year: new Date().getFullYear()});
            }
        }
        this.addingGift = false; this.newGiftEventId = null; this.newGiftPersonName = null; this.giftFormState = { giftName: '', person: '', event: '', price: '', shop: '', notes: '', status: 'idea', url: '' }; this.saveData(); this.render();
    }
    updateGift(id, updates) { const g = this.gifts.find(x => x.id === id); if (g) Object.assign(g, updates); this.saveData(); this.render(); }
    deleteGift(id) { this.gifts = this.gifts.filter(g => g.id !== id); this.events.forEach(e => { if (e.giftIds) e.giftIds = e.giftIds.filter(gid => gid !== id); }); this.saveData(); this.render(); }
    expandGift(id) { this.expandedGift = this.expandedGift === id ? null : id; this.editingGift = null; this.render(); }
    toggleEditGift(id) { this.editingGift = this.editingGift === id ? null : id; this.render(); }
    getGiftsForEvent(eid) { return this.gifts.filter(g => g.eventId === eid); }
    getGiftsForPerson(name) { return this.gifts.filter(g => g.personName === name); }
    getGiftsForEventAndPerson(eid, name) { return this.gifts.filter(g => g.eventId === eid && g.personName === name); }
    isEventUpcoming(e) { const p = e.date.split('-'); return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0])) >= new Date(); }
    getSortedPeople() { return [...this.people].sort((a, b) => a.fullName.localeCompare(b.fullName)); }
    getGiftablePeople() { return this.getSortedPeople().filter(p => !p.fyiOnly); }
    getSortedEvents() { return [...this.events].sort((a, b) => { const [dA, mA, yA] = a.date.split('-'); const [dB, mB, yB] = b.date.split('-'); return new Date(parseInt(yA), parseInt(mA) - 1, parseInt(dA)) - new Date(parseInt(yB), parseInt(mB) - 1, parseInt(dB)); }); }
    getMonthYear(dateStr) { if (!dateStr) return ''; const p = dateStr.split('-'); return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0])).toLocaleDateString('en-US', {month: 'long', year: 'numeric'}); }
    getTotalSpent() { return this.gifts.reduce((s, g) => s + g.price, 0); }
    getAverageBirthdaySpend() {
        const birthdayEvents = this.events.filter(e => e.type === 'birthday');
        if (birthdayEvents.length === 0) return 0;
        const spent = birthdayEvents.reduce((s, e) => s + this.getGiftsForEvent(e.id).reduce((s2, g) => s2 + g.price, 0), 0);
        return (spent / birthdayEvents.length).toFixed(2);
    }
    getAverageChristmasSpend() {
        const christmasEvents = this.events.filter(e => e.type === 'christmas');
        if (christmasEvents.length === 0) return 0;
        const spent = christmasEvents.reduce((s, e) => s + this.getGiftsForEvent(e.id).reduce((s2, g) => s2 + g.price, 0), 0);
        return (spent / christmasEvents.length).toFixed(2);
    }
    getTopGiftees() {
        const gpp = {};
        this.gifts.forEach(g => {
            if (g.personName) {
                if (!gpp[g.personName]) gpp[g.personName] = { count: 0, spent: 0 };
                gpp[g.personName].count++;
                gpp[g.personName].spent += g.price;
            }
        });
        return Object.entries(gpp).map(([name, data]) => ({ name, ...data })).sort((a, b) => b.spent - a.spent).slice(0, 5);
    }
    getPurchasedVsUnpurchased() {
        const purchased = this.gifts.filter(g => g.status === 'purchased').length;
        const unpurchased = this.gifts.filter(g => g.status === 'not purchased').length;
        return { purchased, unpurchased, total: purchased + unpurchased };
    }
    exportToCSV() {
        let csv = 'GIFT TRACKER EXPORT\n';
        csv += 'Export Date: ' + new Date().toLocaleString() + '\n\n';
        csv += '=== PEOPLE ===\n';
        csv += 'ID,Full Name,Birthday (DD-MM),Birth Year,Likes,Dislikes,Notes,Include in Christmas\n';
        this.people.forEach(p => {
            csv += p.id + ',"' + p.fullName + '",' + p.birthday + ',' + p.birthYear + ',"' + (p.likes || '') + '","' + (p.dislikes || '') + '","' + (p.notes || '') + '",' + (p.includeInChristmas ? 'Yes' : 'No') + '\n';
        });
        csv += '\n=== EVENTS ===\n';
        csv += 'ID,Type,Name,Date (DD-MM-YYYY),Budget,Notes,Person ID,Person Name,Year\n';
        this.events.forEach(e => {
            csv += e.id + ',' + e.type + ',"' + e.name + '",' + e.date + ',' + e.budget + ',"' + (e.notes || '') + '",' + (e.personId || '') + ',"' + (e.personName || '') + '",' + e.year + '\n';
        });
        csv += '\n=== GIFTS ===\n';
        csv += 'ID,Gift Name,Person Name,Event ID,Status,Price,URL,Notes,Category\n';
        this.gifts.forEach(g => {
            csv += g.id + ',"' + g.giftName + '","' + (g.personName || '') + '",' + (g.eventId || '') + ',' + g.status + ',' + g.price + ',"' + (g.url || '') + '","' + (g.notes || '') + '",' + (g.category || 'other') + '\n';
        });
        const blob = new Blob([csv], {type: 'text/csv'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'gift-tracker-' + new Date().toISOString().split('T')[0] + '.csv';
        link.click();
    }
    importFromPaste(pasteText) {
        try {
            const lines = pasteText.trim().split('\n');
            
            if (lines.length < 1) throw new Error('No data pasted');
            
            let headers = lines[0].split('\t').map(h => h.trim().toLowerCase());
            let startRow = 0;
            
            const knownHeaders = ['fullname', 'birthday', 'likes', 'dislikes', 'notes', 'giftname', 'personname', 'status', 'price', 'id', 'url', 'eventname'];
            const isHeaderRow = headers.some(h => knownHeaders.includes(h));
            
            console.log('First row headers:', headers);
            console.log('Is header row?', isHeaderRow);
            
            if (!isHeaderRow) {
                console.log('First row appears to be data, not headers. Auto-detecting...');
                if (lines[0].includes('1990') || lines[0].includes('2000') || lines[0].includes('-')) {
                    headers = ['id', 'fullname', 'birthday', 'likes', 'dislikes', 'notes'];
                    startRow = 0;
                }
            } else {
                startRow = 1;
            }
            
            console.log('Using headers:', headers);
            console.log('Starting data from row:', startRow);
            
            let peopleImported = 0;
            let giftsImported = 0;
            let report = [];
            
            lines.slice(startRow).forEach((line, idx) => {
                const rowNum = startRow + idx + 1;
                if (!line.trim()) {
                    report.push('⚠️ Row ' + rowNum + ': Empty row - SKIPPED');
                    return;
                }
                
                try {
                    const values = line.split('\t').map(v => v.trim());
                    const row = {};
                    headers.forEach((h, i) => { 
                        row[h] = values[i];
                    });
                    
                    console.log('Row ' + rowNum + ' parsed:', row);
                    
                    const fullName = row.fullname;
                    let birthday = row.birthday;
                    const likes = row.likes;
                    const dislikes = row.dislikes;
                    const notes = row.notes;
                    
                    if (fullName) {
                        let year = new Date().getFullYear();
                        let bdayStr = '01-01';
                        
                        if (birthday && birthday.trim()) {
                            if (birthday.includes('-') && birthday.includes(' ')) {
                                const parts = birthday.split(' ')[0].split('-');
                                if (parts.length === 3) {
                                    year = parseInt(parts[0]);
                                    bdayStr = String(parseInt(parts[2])).padStart(2, '0') + '-' + String(parseInt(parts[1])).padStart(2, '0');
                                }
                            } else if (birthday.includes('-')) {
                                const parts = birthday.split('-');
                                if (parts.length === 3) {
                                    year = parseInt(parts[0]);
                                    bdayStr = String(parseInt(parts[2])).padStart(2, '0') + '-' + String(parseInt(parts[1])).padStart(2, '0');
                                }
                            }

                        giftsImported++;

    importData(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = e.target.result;
                if (file.name.endsWith('.csv')) {
                    this.importCSV(data);
                } else if (file.name.endsWith('.xlsx')) {
                    this.waitForXLSX(data, file.name, 0);
                } else {
                    alert('Error: File must be CSV or XLSX');
                }
            } catch (err) {
                alert('Import Error:\n\n' + err.message);
            }
        };
        reader.onerror = () => {
            alert('Error reading file. Make sure it\'s a valid CSV or XLSX file.');
        };
        reader.readAsArrayBuffer(file);
    }
    waitForXLSX(data, filename, attempts) {
        if (attempts > 30) {
            alert('⚠️ XLSX library failed to load after 15 seconds.\n\nThis is a technical issue with the library loading from the internet.\n\n✅ WORKAROUND: Use CSV import instead\n\nTo convert XLSX to CSV:\n1. Email yourself the file\n2. Open in Google Sheets (sheets.google.com)\n3. File → Download → CSV\n4. Import the CSV here\n\nOr manually add your data in the app.');
            console.error('XLSX library failed to load. Available libraries:', Object.keys(window).filter(k => k.includes('XLSX') || k.includes('xlsx')));
            return;
        }
        if (typeof XLSX !== 'undefined' && XLSX.read) {
            console.log('✅ XLSX library ready, importing...');
            this.importXLSX(data);
        } else {
            console.log('⏳ Waiting for XLSX library... attempt ' + (attempts + 1) + '/30, XLSX type: ' + typeof XLSX);
            setTimeout(() => this.waitForXLSX(data, filename, attempts + 1), 500);
        }
    }
    importCSV(data) {
        try {
            const text = new TextDecoder().decode(data);
            const lines = text.trim().split('\n');
            
            if (lines.length < 1) throw new Error('CSV file is empty');
            
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            console.log('CSV Headers found:', headers);
            
            let peopleImported = 0;
            let giftsImported = 0;
            let report = [];
            
            lines.slice(1).forEach((line, idx) => {
                const rowNum = idx + 2;
                if (!line.trim()) {
                    report.push('⚠️ Row ' + rowNum + ': Empty row - SKIPPED');
                    return;
                }
                
                try {
                    const values = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                    const row = {};
                    headers.forEach((h, i) => { row[h] = values[i]; });
                    
                    const fullName = row.fullname;
                    const birthday = row.birthday;
                    const giftName = row.giftname;
                    const personName = row.personname;
                    
                    if (fullName && birthday) {
                        this.importPerson(row);
                        peopleImported++;
                        report.push('✅ Row ' + rowNum + ': Person "' + fullName + '" imported');
                    } else if (fullName || birthday) {
                        report.push('⚠️ Row ' + rowNum + ': Missing ' + (!fullName ? 'fullname' : 'birthday') + ' - SKIPPED');
                    }
                    
                    if (giftName && personName) {
                        this.importGift(row);
                        giftsImported++;
                        report.push('✅ Row ' + rowNum + ': Gift "' + giftName + '" for "' + personName + '" imported');
                    } else if (giftName || personName) {
                        report.push('⚠️ Row ' + rowNum + ': Missing ' + (!giftName ? 'giftname' : 'personname') + ' - SKIPPED');
                    }
                } catch (e) {
                    report.push('❌ Row ' + rowNum + ': ' + e.message);
                }
            });
            
            this.saveData();
            
            let msg = '📊 CSV IMPORT REPORT\n\n✅ Imported: ' + peopleImported + ' people, ' + giftsImported + ' gifts\n\nDETAILS:\n' + report.join('\n');
            
            if (msg.length > 2000) {
                alert('Import complete!\n\n✅ People: ' + peopleImported + '\n✅ Gifts: ' + giftsImported + '\n\nFull report:\n' + report.slice(0, 15).join('\n') + '\n\n(See console for full details)');
                console.log(msg);
            } else {
                alert(msg);
            }
            
            this.render();
        } catch (err) {
            alert('❌ CSV Import Error:\n\n' + err.message + '\n\nMake sure:\n• First row contains headers (lowercase): fullname, birthday, giftname, personname\n• Each row is properly comma-separated');
        }
    }
    importXLSX(data) {
        try {
            if (typeof XLSX === 'undefined') throw new Error('XLSX library failed to load');
            
            const wb = XLSX.read(data, {type: 'array'});
            
            if (!wb.SheetNames || wb.SheetNames.length === 0) throw new Error('No sheets found in workbook');
            
            let peopleImported = 0;
            let giftsImported = 0;
            let report = [];
            
            wb.SheetNames.forEach(sheetName => {
                try {
                    const ws = wb.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(ws, {defval: ''});
                    
                    console.log('Sheet "' + sheetName + '" has ' + rows.length + ' rows');
                    
                    if (rows.length > 0) {
                        console.log('First row keys:', Object.keys(rows[0]));
                    }
                    
                    rows.forEach((row, idx) => {
                        const rowNum = idx + 2;
                        try {
                            const fullName = row.fullName || row.fullname;
                            const birthday = row.birthday || row.Birthday;
                            const giftName = row.giftName || row.giftname;
                            const personName = row.personName || row.personname;
                            
                            if (fullName && birthday) {
                                this.importPerson(row);
                                peopleImported++;
                                report.push('✅ Row ' + rowNum + ' (' + sheetName + '): Person "' + fullName + '" imported');
                            } else if (fullName || birthday) {
                                report.push('⚠️ Row ' + rowNum + ' (' + sheetName + '): Missing ' + (!fullName ? 'fullName' : 'birthday') + ' - SKIPPED');
                            }
                            
                            if (giftName && personName) {
                                this.importGift(row);
                                giftsImported++;
                                report.push('✅ Row ' + rowNum + ' (' + sheetName + '): Gift "' + giftName + '" for "' + personName + '" imported');
                            } else if (giftName || personName) {
                                report.push('⚠️ Row ' + rowNum + ' (' + sheetName + '): Missing ' + (!giftName ? 'giftName' : 'personName') + ' - SKIPPED');
                            }
                        } catch (e) {
                            report.push('❌ Row ' + rowNum + ' (' + sheetName + '): ' + e.message);
                        }
                    });
                } catch (e) {
                    report.push('❌ Sheet "' + sheetName + '": ' + e.message);
                }
            });
            
            this.saveData();
            
            let msg = '📊 IMPORT REPORT\n\n✅ Imported: ' + peopleImported + ' people, ' + giftsImported + ' gifts\n\nDETAILS:\n' + report.join('\n');
            
            if (msg.length > 2000) {
                alert('Import complete!\n\n✅ People: ' + peopleImported + '\n✅ Gifts: ' + giftsImported + '\n\nSee full report in console (F12)');
                console.log(msg);
            } else {
                alert(msg);
            }
            
            this.render();
        } catch (err) {
            alert('❌ XLSX Import Error:\n\n' + err.message + '\n\nTroubleshooting:\n• Check Sheet names exist\n• Check column names: fullName, birthday, giftName, personName\n• Status accepts: Gifted, gifted, purchased, or not purchased\n• Try opening the file in Excel to verify format');
        }
    }
    importPerson(row) {
        const name = row.fullName || row.fullname;
        if (!name || this.people.find(p => p.fullName === name)) return;
        let bday = row.birthday || row.Birthday;
        let year = new Date().getFullYear();
        if (typeof bday === 'object' && bday.getTime) {
            year = bday.getFullYear();
            bday = String(bday.getDate()).padStart(2, '0') + '-' + String(bday.getMonth() + 1).padStart(2, '0');
        } else {
            bday = String(bday);
        }
        this.people.push({
            id: Math.max(...this.people.map(p => p.id), 0) + 1,
            fullName: name,
            birthday: bday,
            birthYear: year,
            likes: row.likes || row.Likes || '',
            dislikes: row.dislikes || row.Dislikes || '',
            notes: row.notes || row.Notes || '',
            giftHistory: [],
            includeInChristmas: false,
            messageOnly: false,
            fyiOnly: false
        });
    }
    importGift(row) {
        const name = row.giftName || row.giftname;
        const person = row.personName || row.personname;
        if (!name || !person || this.gifts.find(g => g.giftName === name && g.personName === person)) return;
        let eventId = null;
        const eventName = row.eventName || row.eventname || '';
        if (eventName) {
            let event = this.events.find(e => e.name === eventName);
            if (!event) {
                eventId = Math.max(...this.events.map(e => e.id), 0) + 1;
                this.events.push({
                    id: eventId,
                    type: 'birthday',
                    name: eventName,
                    date: '01-01-2026',
                    budget: 0,
                    notes: '',
                    personId: null,
                    personName: person,
                    year: 2026,
                    people: [{name: person, budget: 0}],
                    giftIds: []
                });
            } else {
                eventId = event.id;
            }
        }
        let status = (row.status || row.Status || 'not purchased').toLowerCase().trim();
        if (status === 'gifted' || status === 'yes') status = 'purchased';
        if (status === 'idea' || status === 'unknown' || status === 'pending') status = 'not purchased';
        if (status !== 'purchased' && status !== 'not purchased') status = 'not purchased';
        
        const giftId = Math.max(...this.gifts.map(g => g.id), 0) + 1;
        this.gifts.push({
            id: giftId,
            giftName: name,
            personName: person,
            eventId: eventId,
            status: status,
            price: parseFloat(row.price || row.Price || 0) || 0,
            url: row.url || row.URL || '',
            notes: row.notes || row.Notes || '',
            category: row.category || row.Category || 'other',
            photoUrl: '',
            purchaseYear: new Date().getFullYear()
        });
        if (eventId) {
            const event = this.events.find(e => e.id === eventId);
            if (!event.giftIds.includes(giftId)) event.giftIds.push(giftId);
        }
    }

            html += '<div class="mb-4"><button onclick="window.app.showEventReady = \'all\'; window.app.showEventCompleted = \'all\'; window.app.render()" class="px-4 py-2 rounded text-sm mr-2" style="background-color: ' + (this.showEventReady === 'all' ? 'var(--color-primary)' : 'var(--color-secondary)') + '; color: ' + (this.showEventReady === 'all' ? 'var(--color-primary-text)' : 'var(--color-text)') + ';">All</button><button onclick="window.app.showEventReady = \'ready\'; window.app.showEventCompleted = \'all\'; window.app.render()" class="px-4 py-2 rounded text-sm mr-2" style="background-color: ' + (this.showEventReady === 'ready' ? 'var(--color-success)' : 'var(--color-secondary)') + '; color: ' + (this.showEventReady === 'ready' ? 'white' : 'var(--color-text)') + ';">Ready</button><button onclick="window.app.showEventReady = \'todo\'; window.app.showEventCompleted = \'all\'; window.app.render()" class="px-4 py-2 rounded text-sm mr-2" style="background-color: ' + (this.showEventReady === 'todo' ? 'var(--color-warning)' : 'var(--color-secondary)') + '; color: ' + (this.showEventReady === 'todo' ? 'white' : 'var(--color-text)') + ';">To Do</button><button onclick="window.app.showEventReady = \'all\'; window.app.showEventCompleted = \'completed\'; window.app.render()" class="px-4 py-2 rounded text-sm" style="background-color: ' + (this.showEventCompleted === 'completed' ? 'var(--color-success)' : 'var(--color-secondary)') + '; color: ' + (this.showEventCompleted === 'completed' ? 'white' : 'var(--color-text)') + ';">Completed</button></div>';
        }
        if (this.addingEvent) {

                html += '<div class="mb-4 p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><button onclick="window.app.selectEventType(\'birthday\')" class="w-full py-2 rounded mb-2 text-white" style="background-color: var(--color-primary); color: var(--color-primary-text);">Birthday</button><button onclick="window.app.selectEventType(\'christmas\')" class="w-full py-2 rounded mb-2 text-white" style="background-color: var(--color-accent);">Christmas</button><button onclick="window.app.selectEventType(\'custom\')" class="w-full py-2 rounded mb-2 text-white" style="background-color: var(--color-primary);">Custom Event</button><button onclick="window.app.toggleAddEvent()" class="w-full py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div>';
            } else if (this.eventType === 'birthday') {
                html += '<div class="mb-4 p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><select id="eperson" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);"><option>Select Person</option>' + this.getSortedPeople().map(p => '<option value="' + p.id + '">' + p.fullName + '</option>').join('') + '</select><select id="eyear" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);"><option>Select Year</option>' + this.getYearDropdown() + '</select><button onclick="window.app.addBirthdayEvent(document.getElementById(\'eperson\').value, document.getElementById(\'eyear\').value)" class="px-4 py-2 rounded text-white mr-2" style="background-color: var(--color-primary); color: var(--color-primary-text);">Add</button><button onclick="window.app.toggleAddEvent()" class="px-4 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div>';
            } else if (this.eventType === 'christmas') {
                html += '<div class="mb-4 p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><select id="cyear" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);"><option>Select Year</option>' + this.getYearDropdown() + '</select><input type="number" id="cbudget" placeholder="Budget" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);"><button onclick="window.app.addChristmasEvent(document.getElementById(\'cyear\').value, document.getElementById(\'cbudget\').value)" class="px-4 py-2 rounded text-white mr-2" style="background-color: var(--color-accent);">Add</button><button onclick="window.app.toggleAddEvent()" class="px-4 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div>';

                    return this.isEventReady(e);
                } else if (this.showEventReady === 'todo') {
                    return !this.isEventReady(e);
                }
            });
        }
        const eventsByMonth = {};
        events.forEach(e => {
            const month = this.getMonthYear(e.date);
            if (!eventsByMonth[month]) eventsByMonth[month] = [];
            eventsByMonth[month].push(e);
        });
        let monthIdx = 0;

                const egifts = this.getGiftsForEvent(e.id);
                const spent = egifts.reduce((s, g) => s + g.price, 0);
                const budgetStatus = this.getBudgetStatus(e);

                const isMessageOnly = person && person.messageOnly;
                html += '<div class="mb-3 swipe-item" data-swipe-item data-event-id="' + e.id + '"><div class="swipe-item-content p-4 rounded-lg border overflow-hidden" style="background-color: var(--color-surface); border-color: var(--color-border);"><div class="flex-1"><button onclick="window.app.expandEvent(' + e.id + ')" class="w-full text-left"><h3 class="font-semibold" style="color: var(--color-text);">' + e.name + '</h3><p class="text-sm" style="color: var(--color-text-muted);">' + (isMessageOnly ? '💬 Message Only' : 'Budget £' + e.budget.toFixed(2) + ' Spent £' + spent.toFixed(2) + ' Gifts ' + egifts.length + ' ' + budgetStatus) + '</p></button>';
                if (isExp) {
                    html += '<div class="mt-3 pt-3 border-t" style="border-color: var(--color-border);">';
                    if (!isMessageOnly) {
                        // For Christmas events, dynamically get people with includeInChristmas set

                        if (e.type === 'christmas') {
                            const christmasYear = e.year;
                            const christmasDate = new Date(christmasYear, 11, 25); // December 25
                            eventPeople = this.people.filter(p => {
                                if (!p.includeInChristmas) return false;
                                // Check if their birthday has passed in the Christmas year
                                const [day, month] = p.birthday.split('-');

                            e.people = eventPeople;
                        }
                        
                        // Show gift assignment interface for each person
                        eventPeople.forEach(p => {
                            // Get gifts for this person that haven't been gifted yet
                            const availableGifts = this.gifts.filter(g => 
                                (g.personName === p.name || !g.personName) &&

                            );
                            const assignedGifts = e.giftAssignments ? e.giftAssignments.filter(ga => ga.personName === p.name).map(ga => this.gifts.find(g => g.id === ga.giftId)) : [];
                            
                            html += '<div class="p-2 rounded border mb-2" style="background-color: var(--color-secondary); border-color: var(--color-border);"><p class="text-xs font-semibold mb-2" style="color: var(--color-text); text-transform: uppercase;">' + p.name + '</p>';
                            
                            // Show assigned gifts
                            if (assignedGifts.length > 0) {
                                assignedGifts.forEach(g => {

                                        html += '<div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; padding: 6px; background-color: var(--color-surface); border-radius: 4px;"><div style="flex: 1;"><div style="color: var(--color-text); font-size: 12px; font-weight: 500;">' + g.giftName + ' <span style="color: var(--color-text-muted); font-weight: normal;">£' + g.price.toFixed(2) + '</span></div><select id="gs_' + g.id + '" onchange="window.app.updateGift(' + g.id + ', {status: this.value})" style="width: 100%; padding: 2px; margin-top: 3px; background-color: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text); font-size: 10px; border-radius: 2px;"><option value="idea"' + (g.status === 'idea' ? ' selected' : '') + '>Idea</option><option value="planned"' + (g.status === 'planned' ? ' selected' : '') + '>Planned</option><option value="bought"' + (g.status === 'bought' ? ' selected' : '') + '>Bought</option><option value="wrapped"' + (g.status === 'wrapped' ? ' selected' : '') + '>Wrapped</option><option value="gifted"' + (g.status === 'gifted' ? ' selected' : '') + '>Gifted</option></select></div><button onclick="window.app.removeGiftFromEvent(' + e.id + ', ' + g.id + ')" style="background-color: var(--color-error); color: white; border: none; padding: 2px 6px; border-radius: 2px; cursor: pointer; font-size: 10px; margin-left: 4px; white-space: nowrap; flex-shrink: 0;">Remove</button></div>';
                                    }
                                });
                            }
                            
                            // Show dropdown to add gift

                                const personIndex = eventPeople.indexOf(p);
                                html += '<select id="eg_' + e.id + '_' + personIndex + '" class="w-full p-1 rounded border" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text); font-size: 11px;"><option value="">Add gift</option>' + availableGifts.map(g => '<option value="' + g.id + '">' + g.giftName + ' (£' + g.price.toFixed(2) + ')</option>').join('') + '</select><button onclick="const sel = document.getElementById(\'eg_' + e.id + '_' + personIndex + '\'); const gid = sel.value; if(gid) { window.app.addGiftToEvent(' + e.id + ', parseInt(gid), \'' + (p.name.replace(/'/g, "\\'")) + '\'); sel.value = \'\'; }" class="w-full py-1 rounded text-sm mt-1" style="background-color: var(--color-accent); color: white; font-size: 11px;">+ Add</button>';
                            }
                            html += '</div>';
                        });
                    }
                    if (isMessageOnly) {
                        html += '<div class="flex items-center p-2 rounded mb-2" style="background-color: var(--color-secondary);"><input type="checkbox" id="msg_check_' + e.id + '" ' + (e.messaged ? 'checked' : '') + ' onchange="window.app.updateEvent(' + e.id + ', {messaged: this.checked})" style="cursor: pointer;"><label for="msg_check_' + e.id + '" style="color: var(--color-text); margin-left: 8px; cursor: pointer;"> Messaged</label></div>';
                    }
                    html += '</div>';
                }
                html += '</div></div><div class="swipe-delete" onclick="window.app.deleteEvent(' + e.id + ')">Delete</div></div>';
            });
            monthIdx++;
        });
        return html;
    }

)') + ';">Gifted</button><button onclick="window.app.showGiftStatus = \'all\'; window.app.render()" class="px-4 py-2 rounded text-sm" style="background-color: ' + (this.showGiftStatus === 'all' ? 'var(--color-primary)' : 'var(--color-secondary)') + '; color: ' + (this.showGiftStatus === 'all' ? 'var(--color-primary-text)' : 'var(--color-text)') + ';">All</button></div>';

="flex gap-2 mb-2"><select id="gshop" onchange="window.app.giftFormState.shop = this.value" class="flex-1 p-2 rounded border" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);"><option value="">Select Shop</option>' + this.shops.map(s => '<option value="' + s + '"' + (this.giftFormState.shop === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select><button onclick="const shop = prompt(\'Enter new shop name:\'); if(shop) window.app.addShop(shop)" class="px-3 py-2 rounded text-white" style="background-color: var(--color-accent); color: white;">+</button></div><textarea id="gnotes" placeholder="Notes" class="w-full p-2 rounded border mb-2" rows="2" style="background-color: var(--color-surface); border-color: var(--color-border);" oninput="window.app.giftFormState.notes = this.value">' + this.giftFormState.notes + '</textarea><select id="gstatus" onchange="window.app.giftFormState.status = this.value" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border);"><option value="idea"' + (this.giftFormState.status === 'idea' ? ' selected' : '') + '>Idea</option><option value="planned"' + (this.giftFormState.status === 'planned' ? ' selected' : '') + '>Planned</option><option value="bought"' + (this.giftFormState.status === 'bought' ? ' selected' : '') + '>Bought</option><option value="wrapped"' + (this.giftFormState.status === 'wrapped' ? ' selected' : '') + '>Wrapped</option><option value="gifted"' + (this.giftFormState.status === 'gifted' ? ' selected' : '') + '>Gifted</option></select><button onclick="if(!window.app.giftFormState.giftName) { alert(\'Please enter gift name\'); return; } window.app.addGift(window.app.giftFormState.giftName, window.app.giftFormState.person, window.app.giftFormState.event, window.app.giftFormState.price, window.app.giftFormState.status, null, window.app.giftFormState.url, window.app.giftFormState.notes, window.app.giftFormState.shop)" class="px-4 py-2 rounded text-white mr-2" style="background-color: var(--color-primary); color: var(--color-primary-text);">Add</button><button onclick="window.app.giftFormState = { giftName: \'\', person: \'\', event: \'\', price: \'\', shop: \'\', notes: \'\', status: \'idea\', url: \'\' }; window.app.toggleAddGift()" class="px-4 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div>';
        }
        const filtered = this.filterGiftsBySearch(this.gifts.filter(g => this.showGiftStatus === 'all' ? true : g.status === this.showGiftStatus));
        filtered.forEach(g => {
            const isExp = this.expandedGift === g.id;
            const isEdit = this.editingGift === g.id;
            html += '<div class="mb-3 swipe-item" data-swipe-item data-gift-id="' + g.id + '"><div class="swipe-item-content p-4 rounded-lg border overflow-hidden" style="background-color: var(--color-surface); border-color: var(--color-border);"><div class="flex-1"><button onclick="window.app.expandGift(' + g.id + ')" class="w-full text-left"><h3 class="font-semibold" style="color: var(--color-text);">' + g.giftName + '</h3><p class="text-sm" style="color: var(--color-text-muted);">£' + g.price.toFixed(2) + ' • ' + g.personName + ' • ' + g.status + '</p></button>';
            if (isExp) {
                const event = this.events.find(e => e.id === g.eventId);
                if (isEdit) {
                    html += '<div class="mt-3 pt-3 border-t" style="border-color: var(--color-border);"><input type="text" id="eg_name_' + g.id + '" value="' + g.giftName + '" placeholder="Gift name" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border);"><select id="eg_person_' + g.id + '" onchange="window.app.render()" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);"><option value="">Select Person (optional)</option>' + this.getGiftablePeople().map(p => '<option value="' + p.fullName + '"' + (g.personName === p.fullName ? ' selected' : '') + '>' + p.fullName + '</option>').join('') + '</select><input type="number" id="eg_price_' + g.id + '" value="' + g.price + '" placeholder="Price" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border);"><input type="text" id="eg_url_' + g.id + '" value="' + g.url + '" placeholder="URL" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border);"><div class="flex gap-2 mb-2"><select id="eg_shop_' + g.id + '" class="flex-1 p-2 rounded border" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);"><option value="">Select Shop</option>' + this.shops.map(s => '<option value="' + s + '"' + (g.shop === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select><button onclick="const shop = prompt(\'Enter new shop name:\'); if(shop) window.app.addShop(shop)" class="px-3 py-2 rounded text-white" style="background-color: var(--color-accent); color: white;">+</button></div><textarea id="eg_notes_' + g.id + '" placeholder="Notes" class="w-full p-2 rounded border mb-2" rows="2" style="background-color: var(--color-surface); border-color: var(--color-border);">' + g.notes + '</textarea><select id="eg_status_' + g.id + '" class="w-full p-2 rounded border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border);"><option value="idea"' + (g.status === 'idea' ? ' selected' : '') + '>Idea</option><option value="planned"' + (g.status === 'planned' ? ' selected' : '') + '>Planned</option><option value="bought"' + (g.status === 'bought' ? ' selected' : '') + '>Bought</option><option value="wrapped"' + (g.status === 'wrapped' ? ' selected' : '') + '>Wrapped</option><option value="gifted"' + (g.status === 'gifted' ? ' selected' : '') + '>Gifted</option></select><button onclick="window.app.updateGift(' + g.id + ', {giftName: document.getElementById(\'eg_name_' + g.id + '\').value, personName: document.getElementById(\'eg_person_' + g.id + '\').value, price: parseFloat(document.getElementById(\'eg_price_' + g.id + '\').value) || 0, url: document.getElementById(\'eg_url_' + g.id + '\').value, shop: document.getElementById(\'eg_shop_' + g.id + '\').value, notes: document.getElementById(\'eg_notes_' + g.id + '\').value, status: document.getElementById(\'eg_status_' + g.id + '\').value}); window.app.editingGift = null;" class="px-4 py-2 rounded text-white mr-2" style="background-color: var(--color-primary); color: var(--color-primary-text);">Save</button><button onclick="window.app.toggleEditGift(' + g.id + ')" class="px-4 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div>';
                } else {
                    html += '<div class="mt-3 pt-3 border-t" style="border-color: var(--color-border);"><div class="p-2 rounded mb-2 border" style="background-color: var(--color-secondary); border-color: var(--color-border);"><p class="text-xs" style="color: var(--color-text-muted);">Category</p><p style="color: var(--color-text);">' + (g.category || 'other') + '</p></div><div class="p-2 rounded mb-2 border" style="background-color: var(--color-secondary); border-color: var(--color-border);"><p class="text-xs" style="color: var(--color-text-muted);">Event</p><p style="color: var(--color-text);">' + (event ? event.name : 'No event') + '</p></div>';
                    if (g.url) {
                        html += '<div class="p-2 rounded mb-2 border" style="background-color: var(--color-secondary); border-color: var(--color-border);"><p class="text-xs" style="color: var(--color-text-muted);">URL</p><p><a href="' + g.url + '" target="_blank" style="color: var(--color-accent);">View link</a></p></div>';
                    }
                    if (g.notes) {
                        html += '<div class="p-2 rounded mb-2 border" style="background-color: var(--color-secondary); border-color: var(--color-border);"><p class="text-xs" style="color: var(--color-text-muted);">Notes</p><p style="color: var(--color-text);">' + g.notes + '</p></div>';
                    }
                    if (g.shop) {
                        html += '<div class="p-2 rounded mb-2 border" style="background-color: var(--color-secondary); border-color: var(--color-border);"><p class="text-xs" style="color: var(--color-text-muted);">Shop</p><p style="color: var(--color-text);">' + g.shop + '</p></div>';
                    }
                    html += '<button onclick="window.app.toggleEditGift(' + g.id + ')" class="w-full py-2 rounded mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">Edit</button>';
                }
            }
            html += '</div></div><div class="swipe-delete" onclick="window.app.deleteGift(' + g.id + ')">Delete</div></div>';
        });
        return html;
    }

    renderReportingTab() {
        const totalSpent = this.getTotalSpent();
        const avgBday = this.getAverageBirthdaySpend();
        const avgXmas = this.getAverageChristmasSpend();
        const topGiftees = this.getTopGiftees();
        const {purchased, unpurchased, total} = this.getPurchasedVsUnpurchased();
        const birthdays = this.events.filter(e => e.type === 'birthday').length;
        const christmas = this.events.filter(e => e.type === 'christmas').length;
        
        let html = '<div class="grid grid-cols-2 gap-3 mb-4">';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-accent); text-transform: uppercase;">Total Spent</p><p class="text-2xl font-bold" style="color: var(--color-text);">£' + totalSpent.toFixed(2) + '</p></div>';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-text-muted); text-transform: uppercase;">Total Gifts</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + total + '</p></div>';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-text-muted); text-transform: uppercase;">Birthdays</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + birthdays + '</p></div>';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-text-muted); text-transform: uppercase;">Christmas</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + christmas + '</p></div>';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-primary); text-transform: uppercase;">Avg Birthday</p><p class="text-xl font-bold" style="color: var(--color-text);">£' + avgBday + '</p></div>';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-success); text-transform: uppercase;">Avg Christmas</p><p class="text-xl font-bold" style="color: var(--color-text);">£' + avgXmas + '</p></div>';
        html += '</div>';
        
        html += '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">Purchase Status</p><div class="flex items-center justify-between mb-2"><span style="color: var(--color-text);">Purchased</span><span class="font-bold" style="color: var(--color-success);">✓ ' + purchased + '</span></div><div class="flex items-center justify-between mb-3"><span style="color: var(--color-text);">Not Purchased</span><span class="font-bold" style="color: var(--color-warning);">○ ' + unpurchased + '</span></div><div class="w-full rounded-full h-2" style="background-color: var(--color-border);"><div class="h-2 rounded-full" style="width: ' + (total > 0 ? (purchased / total * 100) : 0) + '%; background-color: var(--color-success);"></div></div></div>';

        if (topGiftees.length > 0) {
            html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">Top Recipients</p>';
            topGiftees.forEach((giftee, idx) => {
                html += '<div class="flex items-center justify-between pb-2' + (idx < topGiftees.length - 1 ? ' border-b' : '') + '" style="' + (idx < topGiftees.length - 1 ? 'border-color: var(--color-border);' : '') + '"><div><p class="text-sm font-medium" style="color: var(--color-text);">' + (idx + 1) + '. ' + giftee.name + '</p><p class="text-xs" style="color: var(--color-text-muted);">' + giftee.count + ' gift' + (giftee.count > 1 ? 's' : '') + '</p></div><p class="text-sm font-bold" style="color: var(--color-accent);">£' + giftee.spent.toFixed(2) + '</p></div>';
            });
            html += '</div>';
        }

        return html;
    }

    renderSettings() {
        let html = '<div class="max-w-4xl mx-auto px-4 py-4 border-t" style="border-color: var(--color-border); background-color: var(--color-surface);"><h3 class="font-semibold mb-4" style="color: var(--color-text);">Settings</h3><div class="space-y-3"><label class="w-full py-3 px-4 rounded-lg border text-left cursor-pointer" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text); display: block;"><input type="file" accept=".csv,.xlsx" onchange="window.app.importData(this.files[0])" style="display: none;">📤 Import Data<p class="text-xs mt-1" style="color: var(--color-text-muted);">Upload CSV or XLSX file</p></label><button onclick="window.app.showPasteModal(); return false;" class="w-full py-3 px-4 rounded-lg border text-left" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text); text-align: left; cursor: pointer;">📋 Paste Data<p class="text-xs mt-1" style="color: var(--color-text-muted);">Copy from Excel and paste here</p></button><button onclick="const y = prompt(\'Enter year:\'); if(y) window.app.createAllEventsForYear(y)" class="w-full py-3 px-4 rounded-lg border text-left" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);">📅 Auto-Generate Events<p class="text-xs mt-1" style="color: var(--color-text-muted);">Create all birthday and Christmas events for a year</p></button><button onclick="window.app.exportToCSV()" class="w-full py-3 px-4 rounded-lg border text-left" style="background-color: var(--color-surface); border-color: var(--color-border); color: var(--color-text);">📥 Export Data as CSV<p class="text-xs mt-1" style="color: var(--color-text-muted);">Download all your data</p></button></div><h3 class="font-semibold mt-6 mb-4" style="color: var(--color-text);">Shop Database</h3><div style="background-color: var(--color-secondary); border-radius: 8px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--color-border);">';
        if (this.shops.length === 0) {
            html += '<p style="color: var(--color-text-muted); font-size: 14px;">No shops added yet. Add your first shop when creating a gift.</p>';
        } else {
            html += '<div style="display: grid; gap: 8px;">';
            this.shops.forEach((shop, idx) => {
                html += '<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background-color: var(--color-surface); border-radius: 4px; border: 1px solid var(--color-border);"><span style="color: var(--color-text);">' + shop + '</span><button onclick="window.app.deleteShop(' + idx + ')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;">Delete</button></div>';
            });
            html += '</div>';
        }
        html += '</div><button onclick="window.app.toggleSettings()" class="w-full mt-3 py-2 rounded-lg" style="background-color: var(--color-secondary); color: var(--color-text);">Close Settings</button></div>';
        return html;
    }

    render() {
        let content = '';
        if (this.currentTab === 'events') content = this.renderEventsTab();
        else if (this.currentTab === 'people') content = this.renderPeopleTab();
        else if (this.currentTab === 'gifts') content = this.renderGiftsTab();
        else if (this.currentTab === 'reporting') content = this.renderReportingTab();

        const html = '<div style="background-color: var(--color-bg); min-height: 100vh;"><div class="sticky top-0 z-50" style="background-color: var(--color-surface); border-bottom: 1px solid var(--color-border);"><div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between"><div class="flex items-center gap-2"><h1 class="text-2xl font-bold" style="color: var(--color-text);">Gift Tracker</h1></div><div class="flex gap-2"><button onclick="window.app.toggleSettings()" class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">⚙️</button><button onclick="' + (this.currentTab === 'events' ? 'window.app.toggleAddEvent()' : (this.currentTab === 'people' ? 'window.app.toggleAddPerson()' : (this.currentTab === 'gifts' ? 'window.app.toggleAddGift()' : null))) + '" class="w-10 h-10 rounded-full flex items-center justify-center text-white" style="background-color: var(--color-primary); color: var(--color-primary-text);">+</button></div></div>' + (this.showSettings ? this.renderSettings() : '') + '<div class="max-w-4xl mx-auto px-4 flex gap-2 border-t overflow-x-auto" style="border-color: var(--color-border);"><button onclick="window.app.currentTab = \'events\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab === 'events' ? 'var(--color-primary)' : 'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab === 'events' ? 'var(--color-primary)' : 'transparent') + ';">Events</button><button onclick="window.app.currentTab = \'people\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab === 'people' ? 'var(--color-primary)' : 'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab === 'people' ? 'var(--color-primary)' : 'transparent') + ';">People</button><button onclick="window.app.currentTab = \'gifts\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab === 'gifts' ? 'var(--color-primary)' : 'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab === 'gifts' ? 'var(--color-primary)' : 'transparent') + ';">Gifts</button><button onclick="window.app.currentTab = \'reporting\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab === 'reporting' ? 'var(--color-primary)' : 'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab === 'reporting' ? 'var(--color-primary)' : 'transparent') + ';">Reporting</button></div></div><div class="max-w-4xl mx-auto px-4 py-6 pb-20">' + content + '</div></div>';

        document.getElementById('app').innerHTML = html;
        this.initSwipeHandlers();
    }
}

window.app = new GiftTracker();
    </script>
</body>
</html>
